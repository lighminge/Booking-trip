<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手繪白板風 - 行程預約系統</title>
    
    <!-- 引入 React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 讓瀏覽器解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 改用 Firebase Compat CDN，解決 GitHub Pages 上的白畫面衝突 -->
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    
    <!-- 引入 Google Fonts: Kalam (手寫風) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* 手繪白板風自訂樣式 */
        body {
            font-family: 'Kalam', cursive, sans-serif;
            background-color: #f0f0f0;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333;
        }

        .sketchy-border {
            border: 3px solid #2c3e50;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background-color: white;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .sketchy-border-sm {
            border: 2px solid #2c3e50;
            border-radius: 15px 225px 15px 255px/255px 15px 225px 15px;
            background-color: white;
        }

        input, select {
            font-family: 'Kalam', cursive, sans-serif;
            font-size: 1.1rem;
            outline: none;
            background-color: transparent;
        }
        
        input:focus {
            background-color: #fdfbf7;
        }

        .sketchy-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.15);
            border-radius: 15px 255px 15px 225px/225px 15px 255px 15px;
        }
        
        .sketchy-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        .calendar-cell {
            border-right: 2px solid #e2e8f0;
            border-bottom: 2px solid #e2e8f0;
            min-height: 100px;
        }
        .calendar-grid {
            border: 3px solid #2c3e50;
            border-radius: 20px 10px 30px 15px/15px 30px 10px 20px;
            overflow: hidden;
            background: white;
        }

        .reservation-note {
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 2px 15px 5px 10px/10px 5px 15px 2px;
            box-shadow: 2px 2px 3px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .reservation-note:hover {
            transform: scale(1.02) rotate(-1deg);
            z-index: 10;
        }
        
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
            cursor: pointer;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="root" class="max-w-5xl mx-auto"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Firebase 初始化 ---
        const firebaseConfig = {
            apiKey: "AIzaSyB9zuKL8Gbd_qYhyeqwpzCRG20VN2qrjns",
            authDomain: "gemini-db-3e10f.firebaseapp.com",
            projectId: "gemini-db-3e10f",
            storageBucket: "gemini-db-3e10f.firebasestorage.app",
            messagingSenderId: "951641571820",
            appId: "1:951641571820:web:0e6d134ee48536feaa80c9",
            measurementId: "G-FP4EL2V8PG"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const dbCollection = db.collection('reservations');

        const LOCAL_STORAGE_KEY = 'my_standalone_reservations'; // 單機模式儲存鍵值

        // --- 工具函數區 ---
        const pastelColors = [
            '#FFB3BA', '#FFDFBA', '#FFFFBA', '#BAFFC9', '#BAE1FF', 
            '#E8BAFF', '#FFBAFF', '#D4F0F0', '#F3E8FF', '#FEE2E2'
        ];

        const getColorForName = (name) => {
            if (!name) return '#ffffff';
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return pastelColors[Math.abs(hash) % pastelColors.length];
        };

        const formatDate = (date) => {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            const year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        };

        const get24HTime = (ampm, h) => {
            let hour = parseInt(h, 10);
            if (ampm === 'AM' && hour === 12) hour = 12;
            else if (ampm === 'PM' && hour === 12) hour = 24;
            else if (ampm === 'PM') hour += 12;
            return `${hour.toString().padStart(2, '0')}:00`;
        };

        const parseToDate = (dateStr, timeStr) => {
            const [y, m, d] = dateStr.split('-').map(Number);
            const [h, min] = timeStr.split(':').map(Number);
            return new Date(y, m - 1, d, h, min);
        };

        const getRequestedSlots = (startDate, startTime, endDate, endTime) => {
            const slots = [];
            let current = parseToDate(startDate, startTime);
            const end = parseToDate(endDate, endTime);
            while (current < end) {
                const y = current.getFullYear();
                const m = String(current.getMonth() + 1).padStart(2, '0');
                const d = String(current.getDate()).padStart(2, '0');
                const h = String(current.getHours()).padStart(2, '0');
                slots.push(`${y}-${m}-${d} ${h}:00`);
                current = new Date(current.getTime() + 60 * 60 * 1000);
            }
            return slots;
        };

        // 班級選項 (加上相關的小插圖)
        const CLASS_OPTIONS = ['🐻 小熊班', '🐧 企鵝班', '⭐ 星星班', '☀️ 太陽班', '❄️ 雪花班', '☁️ 白雲班'];

        // --- 主程式區 ---
        const App = () => {
            // 狀態管理
            const [reservations, setReservations] = useState([]);
            const [currentDate, setCurrentDate] = useState(new Date());
            const [useLocalMode, setUseLocalMode] = useState(false); // 核心：是否降級為單機模式
            
            // 系統設定狀態 (從 localStorage 讀取以保持記憶)
            const [maxCapacity, setMaxCapacity] = useState(() => Number(localStorage.getItem('max_capacity')) || 3);
            const [isCapacityLocked, setIsCapacityLocked] = useState(() => localStorage.getItem('capacity_locked') === 'true');

            // 自訂 Dialog 狀態
            const [dialog, setDialog] = useState({ isOpen: false, message: '', type: 'alert', onConfirm: null, expectedPin: '', pinToCopy: '', warning: '' });
            const [pinInput, setPinInput] = useState('');
            const [isCopied, setIsCopied] = useState(false);

            const showAlert = (message) => setDialog({ isOpen: true, message, type: 'alert', onConfirm: null });
            const showConfirm = (message, onConfirm) => setDialog({ isOpen: true, message, type: 'confirm', onConfirm });
            const showPinPrompt = (message, expectedPin, onConfirm, resId) => {
                let autoPin = '';
                try {
                    const savedPins = JSON.parse(localStorage.getItem('my_reservation_pins') || '{}');
                    if (savedPins[resId]) autoPin = savedPins[resId];
                } catch (e) {}
                setPinInput(autoPin);
                setDialog({ isOpen: true, message, type: 'pin', expectedPin, onConfirm });
            };

            // 將資料存入本機儲存空間 (降級模式用)
            const saveToLocalDatabase = (newReservations) => {
                setReservations(newReservations);
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(newReservations));
            };

            // 處理 Firebase 錯誤的智慧防護網
            const handleFirebaseError = (error, actionName) => {
                console.warn(`Firebase ${actionName}錯誤 (已自動切換單機模式):`, error);
                
                setUseLocalMode(true); 

                try {
                    const savedData = localStorage.getItem(LOCAL_STORAGE_KEY);
                    if (savedData) setReservations(JSON.parse(savedData));
                } catch (e) {}

                if (error.code === 'permission-denied') {
                    if (error.message && error.message.includes('has not been used')) {
                        showAlert(`⚠️ 找不到雲端資料庫！\n\n系統發現您的 Firebase 專案尚未啟用 Firestore。\n系統已自動為您切換為「單機離線模式」，您仍可繼續測試預約功能！\n\n👉 若要啟用雲端連線：\n請前往 Firebase Console 的 Firestore Database，點擊「建立資料庫 (以測試模式開始)」。`);
                    } else {
                        showAlert(`⚠️ 雲端資料庫權限不足！\n\n系統已自動為您切換為「單機離線模式」。\n\n👉 若要啟用雲端，請將 Firestore Rules 修改為：\nallow read, write: if true;`);
                    }
                } else if (error.code === 'auth/configuration-not-found' || error.code === 'auth/operation-not-allowed') {
                    showAlert('⚠️ Firebase 登入設定提醒：\n\n專案尚未啟用「匿名登入」。\n系統已自動切換為「單機離線模式」。\n👉 若要啟用雲端，請至 Firebase Authentication 開啟「匿名 (Anonymous)」。');
                } else {
                    showAlert(`⚠️ 雲端連線失敗 (${actionName})。\n\n系統已自動為您切換為「單機離線模式」，資料將暫時儲存於您的瀏覽器中。`);
                }
            };

            // --- 初始載入與 Firebase 連線 ---
            useEffect(() => {
                try {
                    const savedData = localStorage.getItem(LOCAL_STORAGE_KEY);
                    if (savedData) setReservations(JSON.parse(savedData));
                } catch (e) {}

                const authenticate = async () => {
                    try {
                        await auth.signInAnonymously();
                    } catch (error) {
                        handleFirebaseError(error, "登入驗證");
                    }
                };
                authenticate();
            }, []);

            useEffect(() => {
                if (useLocalMode) return;

                const unsubscribeDB = dbCollection.onSnapshot((snapshot) => {
                    const loadedReservations = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setReservations(loadedReservations);
                }, (error) => {
                    handleFirebaseError(error, "讀取雲端資料");
                });
                
                return () => unsubscribeDB();
            }, [useLocalMode]);

            // 表單狀態
            const [formData, setFormData] = useState({
                id: null,
                name: '',
                reason: '',
                venue: CLASS_OPTIONS[0], // 預設為小熊班
                startDate: formatDate(new Date()),
                endDate: formatDate(new Date()),
                startAmpm: 'AM',
                startHour: '09',
                endAmpm: 'AM',
                endHour: '10',
                pin: ''
            });

            const [isEditing, setIsEditing] = useState(false);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => {
                    const newData = { ...prev, [name]: value };
                    if (name === 'startDate') newData.endDate = value;
                    if (name === 'startAmpm') newData.endAmpm = value;
                    return newData;
                });
            };

            // 處理鎖定/解鎖容量設定
            const handleLockToggle = () => {
                if (isCapacityLocked) {
                    showPinPrompt('請輸入管理員密碼以解鎖設定：', '8888', () => {
                        setIsCapacityLocked(false);
                        localStorage.setItem('capacity_locked', 'false');
                        showAlert('🔓 設定已解鎖！現在可以修改最高預約數了。');
                    }, 'admin_unlock');
                } else {
                    setIsCapacityLocked(true);
                    localStorage.setItem('capacity_locked', 'true');
                }
            };

            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try { document.execCommand('copy'); } catch (err) {}
                document.body.removeChild(textArea);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                // 防呆：必須選擇特定班級
                if (formData.venue === '全部') return showAlert('請選擇特定的班級來進行預約喔！');
                
                if (!formData.name.trim()) return showAlert('請輸入名字喔！');
                if (!formData.reason.trim()) return showAlert('請輸入預約事由喔！');
                if (formData.startDate > formData.endDate) return showAlert('開始日期不能晚於結束日期喔！');

                const startTime24 = get24HTime(formData.startAmpm, formData.startHour);
                const endTime24 = get24HTime(formData.endAmpm, formData.endHour);

                if (formData.startDate === formData.endDate && startTime24 >= endTime24) {
                    return showAlert('同一天的話，結束時間要晚於開始時間喔！');
                }

                const reqSlots = getRequestedSlots(formData.startDate, startTime24, formData.endDate, endTime24);
                
                for (const slot of reqSlots) {
                    let venueOverlappingCount = 0;
                    for (const res of reservations) {
                        if (isEditing && res.id === formData.id) continue;
                        const resSlots = getRequestedSlots(res.startDate, res.startTime, res.endDate, res.endTime);
                        if (resSlots.includes(slot) && res.venue === formData.venue) {
                            venueOverlappingCount++;
                        }
                    }
                    if (venueOverlappingCount >= maxCapacity) {
                        return showAlert(`Oops！【${formData.venue}】在 ${slot} 的預約已達上限（${maxCapacity}筆）！請選擇其他班級或時段。`);
                    }
                }

                let currentPin = formData.pin;
                if (!isEditing) currentPin = Math.floor(1000 + Math.random() * 9000).toString();

                const newReservationData = {
                    ...formData,
                    startTime: startTime24,
                    endTime: endTime24,
                    color: getColorForName(formData.name),
                    pin: currentPin
                };

                if (useLocalMode) {
                    // --- 單機離線模式儲存邏輯 ---
                    let updatedReservations;
                    if (isEditing) {
                        newReservationData.id = formData.id;
                        updatedReservations = reservations.map(res => res.id === formData.id ? newReservationData : res);
                        saveToLocalDatabase(updatedReservations);
                        setIsEditing(false);
                        showAlert('🎉 預約資料已成功更新！(單機模式)');
                    } else {
                        const newId = Date.now().toString();
                        newReservationData.id = newId;
                        updatedReservations = [...reservations, newReservationData];
                        saveToLocalDatabase(updatedReservations);
                        
                        try {
                            const savedPins = JSON.parse(localStorage.getItem('my_reservation_pins') || '{}');
                            savedPins[newId] = currentPin;
                            localStorage.setItem('my_reservation_pins', JSON.stringify(savedPins));
                        } catch (e) {}

                        setDialog({
                            isOpen: true, type: 'show-pin', message: '您的專屬確認碼為：',
                            pinToCopy: currentPin, warning: '⚠️ 日後若要修改或刪除此預約，將需要輸入此確認碼，請務必妥善記下喔！', onConfirm: null
                        });
                    }
                } else {
                    // --- 雲端 Firebase 儲存邏輯 ---
                    if (isEditing) {
                        newReservationData.id = formData.id;
                        dbCollection.doc(formData.id).set(newReservationData).then(() => {
                            setIsEditing(false);
                            showAlert('🎉 預約資料已成功更新！');
                        }).catch(err => {
                            handleFirebaseError(err, "雲端更新");
                            const updated = reservations.map(res => res.id === formData.id ? newReservationData : res);
                            saveToLocalDatabase(updated);
                            setIsEditing(false);
                        });
                    } else {
                        const newId = Date.now().toString();
                        newReservationData.id = newId;
                        dbCollection.doc(newId).set(newReservationData).then(() => {
                            try {
                                const savedPins = JSON.parse(localStorage.getItem('my_reservation_pins') || '{}');
                                savedPins[newId] = currentPin;
                                localStorage.setItem('my_reservation_pins', JSON.stringify(savedPins));
                            } catch (e) {}

                            setDialog({
                                isOpen: true, type: 'show-pin', message: '您的專屬確認碼為：',
                                pinToCopy: currentPin, warning: '⚠️ 日後若要修改或刪除此預約，將需要輸入此確認碼，請務必妥善記下喔！', onConfirm: null
                            });
                        }).catch(err => {
                            handleFirebaseError(err, "雲端新增");
                            const updated = [...reservations, newReservationData];
                            saveToLocalDatabase(updated);
                        });
                    }
                }

                setFormData(prev => ({
                    ...prev, id: null, name: '', reason: '', venue: CLASS_OPTIONS[0],
                    startAmpm: 'AM', startHour: '09', endAmpm: 'AM', endHour: '10', pin: ''
                }));
            };

            const handleCancelEdit = () => {
                setIsEditing(false);
                setFormData({
                    id: null, name: '', reason: '', venue: CLASS_OPTIONS[0],
                    startDate: formatDate(new Date()), endDate: formatDate(new Date()),
                    startAmpm: 'AM', startHour: '09', endAmpm: 'AM', endHour: '10', pin: ''
                });
            };

            const handleEditClick = (res) => {
                setFormData({
                    id: res.id, name: res.name, reason: res.reason, venue: res.venue || CLASS_OPTIONS[0],
                    startDate: res.startDate, endDate: res.endDate, startAmpm: res.startAmpm, startHour: res.startHour,
                    endAmpm: res.endAmpm, endHour: res.endHour, pin: res.pin || ''
                });
                setIsEditing(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handlePinForEdit = (res) => {
                if (!res.pin) return handleEditClick(res);
                showPinPrompt(`請輸入確認碼以修改【${res.name}】的預約：`, res.pin, () => handleEditClick(res), res.id);
            };

            const handlePinForDelete = (res, e) => {
                e.stopPropagation();
                if (!res.pin) {
                    showConfirm('確定要擦掉這個預約嗎？', () => {
                        if (useLocalMode) {
                            const updated = reservations.filter(r => r.id !== res.id);
                            saveToLocalDatabase(updated);
                            if (formData.id === res.id) handleCancelEdit();
                        } else {
                            dbCollection.doc(res.id).delete().then(() => {
                                if (formData.id === res.id) handleCancelEdit();
                            }).catch(err => handleFirebaseError(err, "雲端刪除"));
                        }
                    });
                    return;
                }
                showPinPrompt(`請輸入確認碼以刪除【${res.name}】的預約：`, res.pin, () => {
                    if (useLocalMode) {
                        const updated = reservations.filter(r => r.id !== res.id);
                        saveToLocalDatabase(updated);
                        if (formData.id === res.id) handleCancelEdit();
                        showAlert('🗑️ 預約已成功刪除！(單機模式)');
                    } else {
                        dbCollection.doc(res.id).delete().then(() => {
                            if (formData.id === res.id) handleCancelEdit();
                            showAlert('🗑️ 預約已成功刪除！');
                        }).catch(err => handleFirebaseError(err, "雲端刪除"));
                    }
                }, res.id);
            };

            const exportToICS = () => {
                if (reservations.length === 0) return showAlert('目前還沒有任何預約資料可以匯出喔！');
                let icsContent = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Handdrawn Calendar//TW\r\nCALSCALE:GREGORIAN\r\n";
                reservations.forEach(res => {
                    const startDt = res.startDate.replace(/-/g, '') + 'T' + res.startTime.replace(/:/g, '') + '00';
                    const endDt = res.endDate.replace(/-/g, '') + 'T' + res.endTime.replace(/:/g, '') + '00';
                    icsContent += "BEGIN:VEVENT\r\n";
                    icsContent += `SUMMARY:【${res.venue}】${res.name} - ${res.reason}\r\n`;
                    icsContent += `DTSTART:${startDt}\r\nDTEND:${endDt}\r\n`;
                    icsContent += `DESCRIPTION:預約人：${res.name}\\n事由：${res.reason}\\n班級：${res.venue}\r\n`;
                    icsContent += "END:VEVENT\r\n";
                });
                icsContent += "END:VCALENDAR";
                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.download = 'reservations.ics';
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                showAlert('📅 匯出成功！\n已下載「reservations.ics」檔案。');
            };

            const exportToExcel = () => {
                if (reservations.length === 0) return showAlert('目前還沒有任何預約資料可以匯出喔！');
                const sortedReservations = [...reservations].sort((a, b) => (a.startDate + a.startTime).localeCompare(b.startDate + b.startTime));
                let csvContent = '\uFEFF開始日期,開始時間,結束日期,結束時間,班級,預約人,預約事由\n';
                sortedReservations.forEach(res => {
                    const safeName = `"${res.name.replace(/"/g, '""')}"`;
                    const safeReason = `"${res.reason.replace(/"/g, '""')}"`;
                    const safeVenue = `"${res.venue.replace(/"/g, '""')}"`;
                    csvContent += `${res.startDate},${res.startTime}:00,${res.endDate},${res.endTime}:00,${safeVenue},${safeName},${safeReason}\n`;
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.download = 'reservations_data.csv';
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                showAlert('📊 匯出成功！\n已下載「reservations_data.csv」檔案。');
            };

            const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
            const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));

            const calendarDays = useMemo(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const days = [];
                for (let i = 0; i < firstDay.getDay(); i++) days.unshift({ date: new Date(year, month, -i), isCurrentMonth: false });
                for (let i = 1; i <= lastDay.getDate(); i++) days.push({ date: new Date(year, month, i), isCurrentMonth: true });
                const remainingCells = 42 - days.length;
                for (let i = 1; i <= remainingCells; i++) days.push({ date: new Date(year, month + 1, i), isCurrentMonth: false });
                return days;
            }, [currentDate]);

            const isReservationOnDate = (res, targetDate) => {
                const targetStr = formatDate(targetDate);
                return targetStr >= res.startDate && targetStr <= res.endDate;
            };

            return (
                <div className="space-y-8 pb-12">
                    {/* 離線單機模式的頂部警告橫幅 */}
                    {useLocalMode && (
                        <div className="bg-yellow-50 border-b-4 border-yellow-400 p-3 md:p-4 text-center sketchy-border-sm mx-4 mt-4 shadow-sm relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-full bg-[radial-gradient(#fbbf24_1px,transparent_1px)] [background-size:16px_16px] opacity-10 pointer-events-none"></div>
                            <h3 className="text-xl md:text-2xl font-bold text-yellow-800 mb-1">⚠️ 目前為「單機離線模式」</h3>
                            <p className="text-yellow-700 font-medium text-sm md:text-base">因雲端資料庫尚未完全啟用，資料暫存於您的裝置中。<br className="hidden md:block"/>請前往 Firebase Console 點擊「建立資料庫」後，重新整理網頁即可恢復雲端連線喔！</p>
                        </div>
                    )}

                    <div className="text-center mt-6 mb-8">
                        <h1 className="text-4xl md:text-5xl font-bold text-slate-800 tracking-wider inline-block relative">
                            行程預約白板
                            <div className="absolute -bottom-2 left-0 w-full h-1 bg-slate-800 rounded-full opacity-70 transform -rotate-1"></div>
                        </h1>
                    </div>

                    <div className="max-w-4xl mx-auto mb-6 flex flex-col md:flex-row justify-end items-center gap-3 px-4">
                        <label className="font-bold text-slate-600">⚙️ 系統設定：每個班級同時段最高預約數</label>
                        <div className="flex items-center gap-2">
                            <select 
                                value={maxCapacity} 
                                onChange={(e) => {
                                    setMaxCapacity(Number(e.target.value));
                                    localStorage.setItem('max_capacity', e.target.value);
                                }} 
                                disabled={isCapacityLocked}
                                className={`sketchy-border-sm px-2 py-1 font-bold outline-none ${isCapacityLocked ? 'bg-gray-100 text-gray-500 cursor-not-allowed' : 'bg-white text-slate-800'}`}
                            >
                                {[1, 2, 3, 4, 5, 10].map(num => <option key={num} value={num}>{num} 筆預約</option>)}
                            </select>
                            <button 
                                onClick={handleLockToggle}
                                type="button"
                                className={`sketchy-btn sketchy-border-sm px-3 py-1 font-bold text-sm transition-colors ${isCapacityLocked ? 'bg-slate-200 text-slate-600' : 'bg-red-100 text-red-700'}`}
                            >
                                {isCapacityLocked ? '🔒 解鎖' : '🔓 鎖定'}
                            </button>
                        </div>
                    </div>

                    <div className="sketchy-border p-6 md:p-8 max-w-4xl mx-auto relative bg-white">
                        <div className="absolute -top-4 -left-4 w-12 h-12 bg-red-400 rounded-full opacity-50 flex items-center justify-center transform -rotate-12">
                            <span className="text-white font-bold text-xl">PIN</span>
                        </div>
                        <h2 className="text-2xl font-bold mb-6 text-slate-700 flex items-center">
                            <span className="mr-2">✍️</span>{isEditing ? '修改預約資料' : '新增預約資料'}
                        </h2>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="flex flex-col md:flex-row gap-4 items-start">
                                <div className="w-full md:w-1/3">
                                    <label className="block text-lg font-bold mb-2 text-slate-600">你的名字</label>
                                    <input type="text" name="name" value={formData.name} onChange={handleInputChange} placeholder="例如：王小明" className="sketchy-border-sm w-full px-4 py-2 text-xl" required />
                                </div>
                                <div className="w-full md:w-2/3">
                                    <label className="block text-lg font-bold mb-2 text-slate-600">預約事由</label>
                                    <input type="text" name="reason" value={formData.reason} onChange={handleInputChange} placeholder="例如：專案開會..." className="sketchy-border-sm w-full px-4 py-2 text-xl" required />
                                </div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-50 p-4 rounded-xl border-2 border-dashed border-slate-300">
                                <div className="space-y-4 md:col-span-1">
                                    <div>
                                        <label className="block text-lg font-bold mb-1 text-blue-700">選擇班級</label>
                                        <select name="venue" value={formData.venue} onChange={handleInputChange} className="sketchy-border-sm w-full px-3 py-2 bg-white">
                                            {CLASS_OPTIONS.map(v => <option key={v} value={v}>{v}</option>)}
                                            <option value="全部">🌈 全部班級</option>
                                        </select>
                                    </div>
                                    <div className="p-3 bg-blue-50 text-blue-800 text-sm rounded-lg sketchy-border-sm mt-4 hidden md:block">
                                        💡 提示：<br/>時間以<b>小時</b>為單位。<br/>同一個班級同時段最多接受 <b>{maxCapacity}</b> 筆預約唷！
                                    </div>
                                </div>
                                <div className="space-y-4 md:col-span-1">
                                    <div>
                                        <label className="block text-lg font-bold mb-1 text-green-700">開始日期</label>
                                        <input type="date" name="startDate" value={formData.startDate} onChange={handleInputChange} className="sketchy-border-sm w-full px-3 py-2 bg-white" required />
                                    </div>
                                    <div>
                                        <label className="block text-lg font-bold mb-1 text-green-700">開始時間</label>
                                        <div className="flex gap-2">
                                            <select name="startAmpm" value={formData.startAmpm} onChange={handleInputChange} className="sketchy-border-sm px-1 py-2 flex-1 text-center bg-white"><option value="AM">上午</option><option value="PM">下午</option></select>
                                            <select name="startHour" value={formData.startHour} onChange={handleInputChange} className="sketchy-border-sm px-1 py-2 flex-1 text-center bg-white">{Array.from({length: 12}, (_, i) => String(i + 1).padStart(2, '0')).map(h => <option key={h} value={h}>{h}時</option>)}</select>
                                        </div>
                                    </div>
                                </div>
                                <div className="space-y-4 md:col-span-1">
                                    <div>
                                        <label className="block text-lg font-bold mb-1 text-red-700">結束日期</label>
                                        <input type="date" name="endDate" value={formData.endDate} onChange={handleInputChange} min={formData.startDate} className="sketchy-border-sm w-full px-3 py-2 bg-white" required />
                                    </div>
                                    <div>
                                        <label className="block text-lg font-bold mb-1 text-red-700">結束時間</label>
                                        <div className="flex gap-2">
                                            <select name="endAmpm" value={formData.endAmpm} onChange={handleInputChange} className="sketchy-border-sm px-1 py-2 flex-1 text-center bg-white"><option value="AM">上午</option><option value="PM">下午</option></select>
                                            <select name="endHour" value={formData.endHour} onChange={handleInputChange} className="sketchy-border-sm px-1 py-2 flex-1 text-center bg-white">{Array.from({length: 12}, (_, i) => String(i + 1).padStart(2, '0')).map(h => <option key={h} value={h}>{h}時</option>)}</select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex justify-center md:justify-end gap-4 mt-2">
                                {isEditing && <button type="button" onClick={handleCancelEdit} className="sketchy-btn sketchy-border-sm bg-gray-200 text-slate-700 font-bold text-xl px-8 py-2 w-full md:w-auto">取消</button>}
                                <button type="submit" className="sketchy-btn sketchy-border-sm bg-slate-800 text-white font-bold text-xl px-12 py-2 w-full md:w-auto">{isEditing ? '更新送出' : '確認預約！'}</button>
                            </div>
                        </form>
                    </div>

                    <div className="max-w-6xl mx-auto mt-12">
                        <div className="flex flex-col md:flex-row items-center justify-between mb-4 px-4 gap-4">
                            <div className="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                                <button onClick={exportToICS} className="sketchy-btn sketchy-border-sm px-4 py-2 bg-blue-50 text-blue-800 font-bold flex items-center gap-2 hover:bg-blue-100 justify-center"><span className="text-xl">📅</span> Google 日曆</button>
                                <button onClick={exportToExcel} className="sketchy-btn sketchy-border-sm px-4 py-2 bg-green-50 text-green-800 font-bold flex items-center gap-2 hover:bg-green-100 justify-center"><span className="text-xl">📊</span> 匯出 Excel</button>
                            </div>
                            <div className="flex items-center justify-between w-full md:w-auto gap-4">
                                <button onClick={prevMonth} className="sketchy-btn sketchy-border-sm px-4 py-1 text-xl md:text-2xl font-bold bg-white">&lt; 上個月</button>
                                <h2 className="text-2xl md:text-3xl font-bold text-slate-800 whitespace-nowrap">{currentDate.getFullYear()} 年 {currentDate.getMonth() + 1} 月</h2>
                                <button onClick={nextMonth} className="sketchy-btn sketchy-border-sm px-4 py-1 text-xl md:text-2xl font-bold bg-white">下個月 &gt;</button>
                            </div>
                        </div>

                        {/* 顯示目前的過濾狀態 */}
                        <div className="text-center mb-4">
                            <span className="bg-slate-800 text-white px-4 py-1 sketchy-border-sm text-lg font-bold shadow-sm">
                                📍 目前顯示：{formData.venue === '全部' ? '🌈 所有班級的預約' : `【${formData.venue}】專屬預約`}
                            </span>
                        </div>

                        <div className="calendar-grid bg-white shadow-lg">
                            <div className="grid grid-cols-7 bg-slate-800 text-white border-b-4 border-slate-800">
                                {['日', '一', '二', '三', '四', '五', '六'].map(day => <div key={day} className="py-3 text-center font-bold text-xl border-r border-slate-700 last:border-r-0">星期{day}</div>)}
                            </div>
                            <div className="grid grid-cols-7 bg-white">
                                {calendarDays.map((dayObj, index) => {
                                    // 【核心修改】日曆現在會根據上面選單選擇的「班級」來進行過濾顯示
                                    const dayReservations = reservations
                                        .filter(res => isReservationOnDate(res, dayObj.date))
                                        .filter(res => formData.venue === '全部' ? true : res.venue === formData.venue)
                                        .sort((a, b) => a.startTime.localeCompare(b.startTime));
                                        
                                    const isToday = formatDate(dayObj.date) === formatDate(new Date());
                                    return (
                                        <div key={index} className={`calendar-cell p-1 md:p-2 ${dayObj.isCurrentMonth ? '' : 'bg-gray-100 text-gray-400'} ${isToday ? 'bg-yellow-50' : ''}`}>
                                            <div className="flex justify-between items-start mb-1">
                                                <span className={`font-bold text-lg inline-block w-8 h-8 text-center leading-8 rounded-full ${isToday ? 'bg-red-400 text-white' : ''}`}>{dayObj.date.getDate()}</span>
                                            </div>
                                            <div className="space-y-1 mt-2">
                                                {dayReservations.map(res => (
                                                    <div key={res.id} onClick={() => handlePinForEdit(res)} className="reservation-note text-sm p-1.5 px-2 relative group" style={{ backgroundColor: res.color }} title="點擊修改內容">
                                                        <div className="font-bold truncate text-slate-800 flex items-center justify-between">
                                                            <span>{res.name}</span><span className="text-[10px] bg-white/60 px-1 rounded sketchy-border-sm">{res.venue}</span>
                                                        </div>
                                                        <div className="text-sm truncate text-slate-800 font-medium mb-1">{res.reason}</div>
                                                        <div className="text-xs text-slate-700 opacity-90 truncate">
                                                            {res.startDate !== res.endDate ? (formatDate(dayObj.date) === res.startDate ? `起 ${res.startAmpm==='AM'?'上午':'下午'} ${res.startHour}:00` : formatDate(dayObj.date) === res.endDate ? `止 ${res.endAmpm==='AM'?'上午':'下午'} ${res.endHour}:00` : '整天') : (`${res.startAmpm==='AM'?'上午':'下午'} ${res.startHour}:00 - ${res.endAmpm==='AM'?'上午':'下午'} ${res.endHour}:00`)}
                                                        </div>
                                                        <button onClick={(e) => handlePinForDelete(res, e)} className="absolute -top-2 -right-2 bg-slate-800 text-white rounded-full w-5 h-5 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity" title="刪除">×</button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        <div className="mt-4 text-center text-slate-500 font-bold">💡 提示：直接點擊日曆上的預約項目（彩色便利貼），就可以把它拉回上方白板進行修改喔！</div>
                    </div>

                    {dialog.isOpen && (
                        <div className="fixed inset-0 bg-slate-900 bg-opacity-40 flex items-center justify-center z-50 px-4">
                            <div className="bg-white p-6 md:p-8 rounded-2xl sketchy-border max-w-sm w-full shadow-2xl transform scale-100 transition-transform">
                                <h3 className="text-2xl font-bold text-slate-800 mb-4">
                                    {dialog.type === 'confirm' ? '🤔 請確認' : dialog.type === 'pin' ? '🔐 身分驗證' : dialog.type === 'show-pin' ? '🎉 預約成功' : '💡 提示'}
                                </h3>
                                {dialog.type !== 'show-pin' && <div className="text-xl text-slate-600 mb-6 whitespace-pre-wrap leading-relaxed">{dialog.message}</div>}
                                {dialog.type === 'show-pin' && (
                                    <div className="mb-6 text-slate-600">
                                        <div className="text-xl whitespace-pre-wrap leading-relaxed mb-4">{dialog.message}</div>
                                        <div className="flex items-center justify-center gap-4 bg-slate-100 p-4 rounded-xl sketchy-border-sm mb-4">
                                            <span className="text-4xl font-bold tracking-[0.2em] text-slate-800">{dialog.pinToCopy}</span>
                                            <button onClick={() => { copyToClipboard(dialog.pinToCopy); setIsCopied(true); setTimeout(() => setIsCopied(false), 2000); }} className={`sketchy-btn sketchy-border-sm px-4 py-2 font-bold text-md transition-colors ${isCopied ? 'bg-green-600 text-white' : 'bg-slate-800 text-white'}`}>{isCopied ? '已複製 ✓' : '複製'}</button>
                                        </div>
                                        <div className="text-md text-red-600 font-bold whitespace-pre-wrap leading-relaxed">{dialog.warning}</div>
                                    </div>
                                )}
                                {dialog.type === 'pin' && (
                                    <div className="flex flex-col items-center">
                                        <input type="text" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="請輸入4碼數字" className="sketchy-border-sm w-full px-4 py-2 text-2xl mb-4 text-center tracking-[0.5em] font-bold text-slate-700 bg-slate-50" maxLength={4} />
                                        <div className="text-sm text-slate-500 text-center mb-6 w-full bg-yellow-50 p-3 rounded-lg sketchy-border-sm">💡 <b>忘記確認碼？</b><br/>使用原設備開啟會自動填入。<br/>或輸入 8888 管理員密碼。</div>
                                    </div>
                                )}
                                <div className="flex justify-end gap-3">
                                    {(dialog.type === 'confirm' || dialog.type === 'pin') && <button onClick={() => setDialog({ ...dialog, isOpen: false })} className="sketchy-btn sketchy-border-sm px-5 py-2 bg-gray-100 text-slate-700 font-bold text-lg">取消</button>}
                                    <button onClick={() => {
                                        if (dialog.type === 'pin') {
                                            if (String(pinInput) === String(dialog.expectedPin) || String(pinInput) === "8888") {
                                                if (dialog.onConfirm) dialog.onConfirm(); setDialog({ ...dialog, isOpen: false });
                                            } else { setDialog({ isOpen: true, message: '❌ 密碼錯誤！\n請重新確認後再試。', type: 'alert', onConfirm: null }); }
                                        } else {
                                            if (dialog.onConfirm) dialog.onConfirm(); setDialog({ ...dialog, isOpen: false });
                                        }
                                    }} className="sketchy-btn sketchy-border-sm px-5 py-2 bg-slate-800 text-white font-bold text-lg">確定</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
