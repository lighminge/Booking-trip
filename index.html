<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手繪白板風 - 行程預約系統 (親師版)</title>
    
    <!-- 引入 React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 讓瀏覽器解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 改用 Firebase Compat CDN，解決 GitHub Pages 上的白畫面衝突 -->
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    
    <!-- 引入 Google Fonts: Kalam (手寫風) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kalam', cursive, sans-serif;
            background-color: #f0f0f0;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333;
        }
        .sketchy-border {
            border: 3px solid #2c3e50;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background-color: white;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        .sketchy-border-sm {
            border: 2px solid #2c3e50;
            border-radius: 15px 225px 15px 255px/255px 15px 225px 15px;
            background-color: white;
        }
        input, select, textarea {
            font-family: 'Kalam', cursive, sans-serif;
            font-size: 1.1rem;
            outline: none;
            background-color: transparent;
        }
        input:focus, textarea:focus {
            background-color: #fdfbf7;
        }
        .sketchy-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.15);
            border-radius: 15px 255px 15px 225px/225px 15px 255px 15px;
        }
        .sketchy-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }
        .sketchy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .calendar-cell {
            border-right: 2px solid #e2e8f0;
            border-bottom: 2px solid #e2e8f0;
            min-height: 120px;
        }
        .calendar-grid {
            border: 3px solid #2c3e50;
            border-radius: 20px 10px 30px 15px/15px 30px 10px 20px;
            overflow: hidden;
            background: white;
        }
        .reservation-note {
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 2px 15px 5px 10px/10px 5px 15px 2px;
            box-shadow: 2px 2px 3px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .reservation-note:hover {
            transform: scale(1.02) rotate(-1deg);
            z-index: 10;
        }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
            cursor: pointer;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="root" class="max-w-6xl mx-auto"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Firebase 初始化 ---
        const firebaseConfig = {
            apiKey: "AIzaSyB9zuKL8Gbd_qYhyeqwpzCRG20VN2qrjns",
            authDomain: "gemini-db-3e10f.firebaseapp.com",
            projectId: "gemini-db-3e10f",
            storageBucket: "gemini-db-3e10f.firebasestorage.app",
            messagingSenderId: "951641571820",
            appId: "1:951641571820:web:0e6d134ee48536feaa80c9",
            measurementId: "G-FP4EL2V8PG"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const dbReservations = db.collection('reservations');
        const dbSettings = db.collection('settings').doc('global_classes');

        const LOCAL_RES_KEY = 'my_standalone_reservations';
        const LOCAL_SET_KEY = 'my_standalone_class_settings';

        // --- 工具函數與常數區 ---
        const CLASS_OPTIONS = ['🐻 小熊班', '🐧 企鵝班', '⭐ 星星班', '☀️ 太陽班', '❄️ 雪花班', '☁️ 白雲班'];
        
        const DEFAULT_CLASS_SETTINGS = CLASS_OPTIONS.reduce((acc, c) => {
            acc[c] = { maxCapacity: 3, maxPerParent: 999, duration: 60, notes: '歡迎家長預約，請準時抵達喔！', slots: [] };
            return acc;
        }, {});

        const pastelColors = ['#FFB3BA', '#FFDFBA', '#FFFFBA', '#BAFFC9', '#BAE1FF', '#E8BAFF', '#FFBAFF', '#D4F0F0', '#F3E8FF', '#FEE2E2'];
        const getColorForName = (name) => {
            if (!name) return '#ffffff';
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return pastelColors[Math.abs(hash) % pastelColors.length];
        };

        const formatDate = (date) => {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            const year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        };

        const addMinutes = (timeStr, mins) => {
            const [h, m] = timeStr.split(':').map(Number);
            const date = new Date(2000, 1, 1, h, m + Number(mins));
            return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        };

        // --- 主程式區 ---
        const App = () => {
            // 全域狀態管理
            const [role, setRole] = useState(null); // null, 'teacher', 'parent'
            const [reservations, setReservations] = useState([]);
            const [classSettings, setClassSettings] = useState(DEFAULT_CLASS_SETTINGS);
            const [currentDate, setCurrentDate] = useState(new Date());
            const [useLocalMode, setUseLocalMode] = useState(false);
            
            // 老師專區狀態
            const [teacherSelectedClass, setTeacherSelectedClass] = useState(CLASS_OPTIONS[0]);
            const [teacherSlotForm, setTeacherSlotForm] = useState({ id: null, date: formatDate(new Date()), startHour: '09', startMin: '00', endHour: '10', endMin: '00' });
            const [isEditingSlot, setIsEditingSlot] = useState(false);
            const [teacherLocalNote, setTeacherLocalNote] = useState('');
            const [maxCapacity, setMaxCapacity] = useState(() => Number(localStorage.getItem('max_capacity')) || 3);
            const [isCapacityLocked, setIsCapacityLocked] = useState(() => localStorage.getItem('capacity_locked') === 'true');
            const [isAttendanceOpen, setIsAttendanceOpen] = useState(false);

            // 家長專區狀態
            const [parentForm, setParentForm] = useState({ childName: '', venue: CLASS_OPTIONS[0], date: '', slotId: '' });
            const [isParentLocked, setIsParentLocked] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);

            // 對話框狀態
            const [dialog, setDialog] = useState({ isOpen: false, message: '', type: 'alert', onConfirm: null, expectedPin: '', pinToCopy: '', warning: '' });
            const [pinInput, setPinInput] = useState('');
            const [isCopied, setIsCopied] = useState(false);

            // 同步老師備註欄位
            useEffect(() => {
                if (teacherSelectedClass === '全部') {
                    setTeacherLocalNote('');
                    return;
                }
                const currentSets = classSettings[teacherSelectedClass] || DEFAULT_CLASS_SETTINGS[teacherSelectedClass] || {};
                setTeacherLocalNote(currentSets.notes || '');
            }, [classSettings, teacherSelectedClass]);

            const calendarDays = useMemo(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const days = [];
                for (let i = 0; i < firstDay.getDay(); i++) days.unshift({ date: new Date(year, month, -i), isCurrentMonth: false });
                for (let i = 1; i <= lastDay.getDate(); i++) days.push({ date: new Date(year, month, i), isCurrentMonth: true });
                const remainingCells = 42 - days.length;
                for (let i = 1; i <= remainingCells; i++) days.push({ date: new Date(year, month + 1, i), isCurrentMonth: false });
                return days;
            }, [currentDate]);

            // 安全空值處理，計算目前家長(同班級+同姓名)已預約數量
            const childNameTrimmed = (parentForm.childName || '').trim();
            const parentBookingsCount = useMemo(() => {
                if (!childNameTrimmed) return 0;
                return reservations.filter(r => r.venue === parentForm.venue && (r.childName || r.name || '').trim() === childNameTrimmed).length;
            }, [reservations, parentForm.venue, childNameTrimmed]);

            // 老師專用：浮動登記簿 (依小孩姓名去重複顯示)
            const attendanceList = useMemo(() => {
                if (role !== 'teacher') return [];
                let res = reservations;
                if (teacherSelectedClass !== '全部') {
                    res = res.filter(r => r.venue === teacherSelectedClass);
                }
                
                const grouped = {};
                res.forEach(r => {
                    const name = (r.childName || r.name || '未命名').trim();
                    if (!grouped[name]) {
                        grouped[name] = { name: name, slots: [], venues: new Set() };
                    }
                    grouped[name].slots.push(r);
                    grouped[name].venues.add(r.venue);
                });
                
                return Object.values(grouped).map(g => ({
                    ...g,
                    venues: Array.from(g.venues),
                    slots: g.slots.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime))
                })).sort((a, b) => a.name.localeCompare(b.name));
            }, [reservations, teacherSelectedClass, role]);

            // 計算無效預約 (孤兒預約)
            const orphanedReservations = useMemo(() => {
                if (role !== 'teacher') return [];
                return reservations.filter(res => {
                    if (teacherSelectedClass !== '全部' && res.venue !== teacherSelectedClass) return false;
                    
                    const cSettings = classSettings[res.venue] || DEFAULT_CLASS_SETTINGS[res.venue] || { slots: [] };
                    const slotExists = (cSettings.slots || []).some(s => s.date === res.date && s.startTime === res.startTime);
                    
                    return !slotExists;
                }).sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
            }, [reservations, classSettings, teacherSelectedClass, role]);

            // 取得可用的家長預約日期與時段
            const currentParentSettings = classSettings[parentForm.venue] || DEFAULT_CLASS_SETTINGS[parentForm.venue] || { slots: [], maxCapacity: 3, maxPerParent: 999, duration: 60 };
            
            const availableDates = useMemo(() => {
                const slots = currentParentSettings.slots || [];
                return [...new Set(slots.map(s => s.date))].sort();
            }, [currentParentSettings.slots]);

            useEffect(() => { setParentForm(prev => ({ ...prev, slotId: '' })); }, [parentForm.date, parentForm.venue]);
            
            // 只要日期或班級選擇變更，自動帶入第一個日期
            useEffect(() => {
                if (availableDates.length > 0 && !parentForm.date) {
                    setParentForm(prev => ({ ...prev, date: availableDates[0] }));
                }
            }, [availableDates]);

            const availableSlotsForDate = useMemo(() => {
                if (!parentForm.date) return [];
                const slots = (currentParentSettings.slots || []).filter(s => s.date === parentForm.date).sort((a,b)=>a.startTime.localeCompare(b.startTime));
                
                return slots.map(slot => {
                    const bookedCount = reservations.filter(r => r.venue === parentForm.venue && r.date === slot.date && r.startTime === slot.startTime).length;
                    const remaining = currentParentSettings.maxCapacity - bookedCount;
                    return { ...slot, bookedCount, remaining };
                });
            }, [currentParentSettings, parentForm.date, parentForm.venue, reservations]);

            // 自動為家長帶入第一個還有剩餘名額的時段
            useEffect(() => {
                if (availableSlotsForDate.length > 0 && !parentForm.slotId) {
                    const firstAvail = availableSlotsForDate.find(s => s.remaining > 0);
                    if (firstAvail) {
                        setParentForm(prev => ({ ...prev, slotId: firstAvail.id }));
                    } else {
                        setParentForm(prev => ({ ...prev, slotId: availableSlotsForDate[0].id }));
                    }
                }
            }, [availableSlotsForDate, parentForm.slotId]);


            const showAlert = (message) => setDialog({ isOpen: true, message, type: 'alert', onConfirm: null });
            const showConfirm = (message, onConfirm) => setDialog({ isOpen: true, message, type: 'confirm', onConfirm });
            const showPinPrompt = (message, expectedPin, onConfirm, resId) => {
                let autoPin = '';
                try {
                    const savedPins = JSON.parse(localStorage.getItem('my_reservation_pins') || '{}');
                    if (savedPins[resId]) autoPin = savedPins[resId];
                } catch (e) {}
                setPinInput(autoPin);
                setDialog({ isOpen: true, message, type: 'pin', expectedPin, onConfirm });
            };

            const saveLocal = (resData, setData) => {
                if (resData) {
                    setReservations(resData);
                    localStorage.setItem(LOCAL_RES_KEY, JSON.stringify(resData));
                }
                if (setData) {
                    setClassSettings(setData);
                    localStorage.setItem(LOCAL_SET_KEY, JSON.stringify(setData));
                }
            };

            const handleFirebaseError = (error, actionName) => {
                console.warn(`Firebase ${actionName}錯誤:`, error);
                setUseLocalMode(true); 
                try {
                    const savedRes = localStorage.getItem(LOCAL_RES_KEY);
                    const savedSet = localStorage.getItem(LOCAL_SET_KEY);
                    if (savedRes) setReservations(JSON.parse(savedRes));
                    if (savedSet) {
                        const parsedSet = JSON.parse(savedSet);
                        const merged = {};
                        for(let c of CLASS_OPTIONS) merged[c] = { ...DEFAULT_CLASS_SETTINGS[c], ...parsedSet[c] };
                        setClassSettings(merged);
                    }
                } catch (e) {}

                if (error.code === 'permission-denied') {
                    showAlert(`⚠️ 雲端資料庫權限不足！\n系統已自動切換為「單機離線模式」。`);
                } else {
                    showAlert(`⚠️ 雲端連線失敗 (${actionName})。\n系統已自動切換為「單機離線模式」。`);
                }
            };

            // --- 初始載入與 Firebase 連線 ---
            useEffect(() => {
                try {
                    const savedRes = localStorage.getItem(LOCAL_RES_KEY);
                    const savedSet = localStorage.getItem(LOCAL_SET_KEY);
                    if (savedRes) setReservations(JSON.parse(savedRes));
                    if (savedSet) {
                        const parsedSet = JSON.parse(savedSet);
                        const merged = {};
                        for(let c of CLASS_OPTIONS) merged[c] = { ...DEFAULT_CLASS_SETTINGS[c], ...parsedSet[c] };
                        setClassSettings(merged);
                    }
                } catch (e) {}

                const authenticate = async () => {
                    try { await auth.signInAnonymously(); } 
                    catch (error) { handleFirebaseError(error, "登入驗證"); }
                };
                authenticate();
            }, []);

            useEffect(() => {
                if (useLocalMode) return;

                const unsubRes = dbReservations.onSnapshot((snapshot) => {
                    setReservations(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }, (error) => handleFirebaseError(error, "讀取預約資料"));

                const unsubSet = dbSettings.onSnapshot((doc) => {
                    if (doc.exists) {
                        const dbClasses = doc.data().classes;
                        const merged = {};
                        for(let c of CLASS_OPTIONS) merged[c] = { ...DEFAULT_CLASS_SETTINGS[c], ...dbClasses[c] };
                        setClassSettings(merged);
                    } else {
                        dbSettings.set({ classes: DEFAULT_CLASS_SETTINGS }).catch(e => console.warn(e));
                    }
                }, (error) => handleFirebaseError(error, "讀取班級設定"));
                
                return () => { unsubRes(); unsubSet(); };
            }, [useLocalMode]);

            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try { document.execCommand('copy'); } catch (err) {}
                document.body.removeChild(textArea);
            };

            // ==========================================
            // 老師專屬方法
            // ==========================================
            const updateClassSetting = (key, value) => {
                if (teacherSelectedClass === '全部') return;
                const currentSettings = classSettings[teacherSelectedClass] || DEFAULT_CLASS_SETTINGS[teacherSelectedClass] || {};
                const newSettings = { ...classSettings, [teacherSelectedClass]: { ...currentSettings, [key]: value } };
                setClassSettings(newSettings);
                if (useLocalMode) saveLocal(null, newSettings);
                else dbSettings.set({ classes: newSettings }, { merge: true }).catch(e => handleFirebaseError(e, "儲存設定"));
            };

            const handleTeacherStartChange = (e) => {
                if (teacherSelectedClass === '全部') return;
                const { name, value } = e.target;
                const newForm = { ...teacherSlotForm, [name]: value };
                const startStr = `${newForm.startHour}:${newForm.startMin}`;
                const currentSettings = classSettings[teacherSelectedClass] || DEFAULT_CLASS_SETTINGS[teacherSelectedClass] || {};
                const endStr = addMinutes(startStr, currentSettings.duration || 60);
                const [endH, endM] = endStr.split(':');
                setTeacherSlotForm({ ...newForm, endHour: endH, endMin: endM });
            };

            const handleAddSlots = () => {
                if (teacherSelectedClass === '全部') return showAlert("請先選擇特定的班級喔！");
                
                const startStr = `${teacherSlotForm.startHour}:${teacherSlotForm.startMin}`;
                const endStr = `${teacherSlotForm.endHour}:${teacherSlotForm.endMin}`;
                
                if (startStr >= endStr) return showAlert("結束時間必須晚於開始時間喔！");
                
                const currentSettings = classSettings[teacherSelectedClass] || DEFAULT_CLASS_SETTINGS[teacherSelectedClass] || {};
                
                if (isEditingSlot) {
                    const newSlots = (currentSettings.slots || []).map(s => 
                        s.id === teacherSlotForm.id ? { ...s, date: teacherSlotForm.date, startTime: startStr, endTime: endStr } : s
                    );
                    updateClassSetting('slots', newSlots);
                    setIsEditingSlot(false);
                    setTeacherSlotForm(prev => ({...prev, id: null}));
                    showAlert(`✅ 時段已成功更新！`);
                } else {
                    const duration = currentSettings.duration || 60;
                    let currentStr = startStr;
                    const generatedSlots = [];

                    while (currentStr < endStr) {
                        let nextStr = addMinutes(currentStr, duration);
                        if (nextStr > endStr) nextStr = endStr; 
                        
                        generatedSlots.push({
                            id: `slot_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
                            date: teacherSlotForm.date,
                            startTime: currentStr,
                            endTime: nextStr
                        });
                        currentStr = nextStr;
                    }

                    const existingSlots = currentSettings.slots || [];
                    const combinedSlots = [...existingSlots, ...generatedSlots].reduce((acc, curr) => {
                        const isDup = acc.find(s => s.date === curr.date && s.startTime === curr.startTime && s.endTime === curr.endTime);
                        if (!isDup) acc.push(curr);
                        return acc;
                    }, []);

                    updateClassSetting('slots', combinedSlots);

                    const nextStartStr = `${teacherSlotForm.endHour}:${teacherSlotForm.endMin}`;
                    const nextEndStr = addMinutes(nextStartStr, duration);
                    const [nH, nM] = nextEndStr.split(':');
                    
                    setTeacherSlotForm(prev => ({
                        ...prev,
                        startHour: prev.endHour,
                        startMin: prev.endMin,
                        endHour: nH,
                        endMin: nM
                    }));

                    showAlert(`✅ 成功產生 ${generatedSlots.length} 個預約時段！\n\n💡 系統已保留日期並自動帶入接續時段，方便您連續新增！`);
                }
            };

            const handleEditSlot = (cName, slot) => {
                setTeacherSelectedClass(cName);
                setTeacherSlotForm({
                    id: slot.id,
                    date: slot.date,
                    startHour: slot.startTime.split(':')[0],
                    startMin: slot.startTime.split(':')[1],
                    endHour: slot.endTime.split(':')[0],
                    endMin: slot.endTime.split(':')[1],
                });
                setIsEditingSlot(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // ==========================================
            // 家長專屬方法
            // ==========================================
            const handleParentSubmit = (e) => {
                if (e) e.preventDefault(); 
                
                if (!parentForm.slotId) return showAlert("請選擇一個預約時段！");

                const selectedSlot = availableSlotsForDate.find(s => s.id === parentForm.slotId);
                if (!selectedSlot) return showAlert("請選擇一個有效的預約時段！");

                const alreadyBooked = reservations.some(r => 
                    r.venue === parentForm.venue && 
                    (r.childName || r.name || '').trim() === childNameTrimmed && 
                    r.date === selectedSlot.date && 
                    r.startTime === selectedSlot.startTime
                );

                if (alreadyBooked) {
                    setParentForm(prev => ({ ...prev, slotId: '' }));
                    return showAlert("⚠️ 預約失敗！\n\n您已經為這位小孩預約過這個時段囉！請勿重複預約。");
                }

                if (currentParentSettings.maxPerParent && currentParentSettings.maxPerParent !== 999 && parentBookingsCount >= currentParentSettings.maxPerParent) {
                    setParentForm(prev => ({ ...prev, slotId: '' }));
                    return showAlert(`⚠️ 預約失敗！\n\n【${childNameTrimmed}】在該班級已達到最高預約上限（共 ${currentParentSettings.maxPerParent} 個時段）。`);
                }

                if (selectedSlot.remaining <= 0) return showAlert("⚠️ 很抱歉，這個時段已經額滿了，請選擇其他時段喔！");

                setIsSubmitting(true);
                const currentPin = Math.floor(1000 + Math.random() * 9000).toString();
                const newReservationData = {
                    id: Date.now().toString(),
                    childName: childNameTrimmed,
                    venue: parentForm.venue,
                    date: selectedSlot.date,
                    startTime: selectedSlot.startTime,
                    endTime: selectedSlot.endTime,
                    color: getColorForName(childNameTrimmed),
                    pin: currentPin
                };

                const handleSuccess = () => {
                    setIsSubmitting(false);
                    setDialog({ isOpen: true, type: 'show-pin', message: '🎉 預約成功！您的專屬確認碼為：', pinToCopy: currentPin, warning: '請務必記下確認碼，若需取消請點擊月曆上您的預約。', onConfirm: null });
                    setParentForm(prev => ({ ...prev, slotId: '' })); 
                };

                if (useLocalMode) {
                    saveLocal([...reservations, newReservationData], null);
                    try {
                        const savedPins = JSON.parse(localStorage.getItem('my_reservation_pins') || '{}');
                        savedPins[newReservationData.id] = currentPin;
                        localStorage.setItem('my_reservation_pins', JSON.stringify(savedPins));
                    } catch(e) {}
                    handleSuccess();
                } else {
                    dbReservations.doc(newReservationData.id).set(newReservationData).then(() => {
                        try {
                            const savedPins = JSON.parse(localStorage.getItem('my_reservation_pins') || '{}');
                            savedPins[newReservationData.id] = currentPin;
                            localStorage.setItem('my_reservation_pins', JSON.stringify(savedPins));
                        } catch(e) {}
                        handleSuccess();
                    }).catch(err => {
                        setIsSubmitting(false);
                        handleFirebaseError(err, "預約新增");
                    });
                }
            };

            // ==========================================
            // 共用月曆模組
            // ==========================================
            const renderCalendarView = (viewRole, viewClass) => {
                const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
                const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));

                const handleDeleteOrphan = (res) => {
                    showConfirm(`確定要刪除 【${res.childName || res.name || '未命名'}】 的無效預約紀錄嗎？\n(此預約原本的時段已被刪除)`, () => {
                        if (useLocalMode) {
                            saveLocal(reservations.filter(r => r.id !== res.id), null);
                            showAlert("🗑️ 已成功刪除無效紀錄！");
                        } else {
                            dbReservations.doc(res.id).delete()
                                .then(() => showAlert("🗑️ 已成功刪除無效紀錄！"))
                                .catch(e => handleFirebaseError(e, "刪除無效預約"));

                    });
                };

                const handleCancelRes = (resId, pin) => {
                    const promptMsg = viewRole === 'teacher' 
                        ? "請輸入確認碼以取消此預約：\n(💡 老師可直接輸入管理員密碼 8888 強制刪除)" 
                        : "請輸入確認碼以取消您的預約：";
                        
                    showPinPrompt(promptMsg, pin, () => {
                        if (useLocalMode) {
                            saveLocal(reservations.filter(r => r.id !== resId), null);
                            showAlert("🗑️ 已成功取消預約！");
                        } else {
                            dbReservations.doc(resId).delete().then(() => showAlert("🗑️ 已成功取消預約！")).catch(e => handleFirebaseError(e, "取消預約"));
                        }
                    }, resId);
                };

                const handleTeacherDeleteSlot = (cName, slotId) => {
                    showConfirm(`確定要刪除這個開放時段嗎？\n(注意：如果有家長已預約，預約紀錄仍會保留在資料庫中，但月曆上將不會再顯示此時段。)` , () => {
                        const cSettings = classSettings[cName] || DEFAULT_CLASS_SETTINGS[cName] || { slots: [] };
                        const newSlots = (cSettings.slots || []).filter(s => s.id !== slotId);
                        const newSettings = { ...classSettings, [cName]: { ...cSettings, slots: newSlots } };
                        setClassSettings(newSettings);
                        if (useLocalMode) saveLocal(null, newSettings);
                        else dbSettings.set({ classes: newSettings }, { merge: true });
                    });
                };

                const exportToICS = () => {
                    if (reservations.length === 0) return showAlert('目前還沒有任何預約資料可以匯出喔！');
                    let icsContent = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Handdrawn Calendar//TW\r\nCALSCALE:GREGORIAN\r\n";
                    reservations.forEach(res => {
                        const rName = res.childName || res.name || '未命名';
                        const startDt = res.date.replace(/-/g, '') + 'T' + res.startTime.replace(/:/g, '') + '00';
                        const endDt = res.date.replace(/-/g, '') + 'T' + res.endTime.replace(/:/g, '') + '00';
                        icsContent += "BEGIN:VEVENT\r\n";
                        icsContent += `SUMMARY:【${res.venue}】${rName}\r\n`;
                        icsContent += `DTSTART:${startDt}\r\nDTEND:${endDt}\r\n`;
                        icsContent += `DESCRIPTION:預約人：${rName}\\n班級：${res.venue}\r\n`;
                        icsContent += "END:VEVENT\r\n";
                    });
                    icsContent += "END:VCALENDAR";
                    const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                    const link = document.createElement('a');
                    link.href = window.URL.createObjectURL(blob);
                    link.download = 'reservations.ics';
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                    showAlert('📅 匯出成功！\n已下載「reservations.ics」檔案。');
                };

                const exportToExcel = () => {
                    if (reservations.length === 0) return showAlert('目前還沒有任何預約資料可以匯出喔！');
                    const sortedReservations = [...reservations].sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
                    let csvContent = '\uFEFF預約日期,時段,班級,小孩姓名\n';
                    sortedReservations.forEach(res => {
                        const rName = res.childName || res.name || '未命名';
                        const safeName = `"${rName.replace(/"/g, '""')}"`;
                        const safeVenue = `"${res.venue.replace(/"/g, '""')}"`;
                        csvContent += `${res.date},${res.startTime}~${res.endTime},${safeVenue},${safeName}\n`;
                    });
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = window.URL.createObjectURL(blob);
                    link.download = '幼兒園預約資料.csv';
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);

                                    const dateStr = formatDate(dayObj.date);

                                    let dailySlots = [];
                                    if (viewClass === '全部') {
                                        CLASS_OPTIONS.forEach(cName => {
                                            const cSlots = (classSettings[cName]?.slots || []).filter(s => s.date === dateStr);
                                            cSlots.forEach(s => dailySlots.push({...s, className: cName}));
                                        });

                                                                            • {r.childName || r.name || '未命名'}

                                                                    ))}

                                                                </>

                                                            {/* 家長視角 */}
                                                            {viewRole === 'parent' && (
                                                                <>
                                                                    <div className="font-bold text-slate-800 text-center">{slot.startTime}~{slot.endTime}</div>

                                                                        <div onClick={() => handleCancelRes(myRes.id, myRes.pin)} className="mt-1 bg-green-200 text-green-900 p-1 rounded text-center font-bold cursor-pointer hover:bg-red-200 transition-colors" title="點擊取消預約">
                                                                            ✓ 你的預約<br/>({myRes.childName || myRes.name || '未命名'})
                                                                        </div>
                                                                    ) : (
                                                                        <div className="text-center mt-1 text-slate-600 font-medium">
                                                                            剩餘名額: {maxCap - slotReservations.length}
                                                                        </div>
                                                                    )}
                                                                </>
                                                            )}
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* 老師視角：無對應時段的預約清單 (孤兒預約) */}
                        {viewRole === 'teacher' && orphanedReservations.length > 0 && (
                            <div className="mt-6 bg-red-50 p-4 md:p-6 sketchy-border-sm rounded-xl border border-red-200">
                                <h3 className="text-xl font-bold text-red-800 mb-3 flex items-center gap-2">
                                    <span>⚠️</span> 系統中存在未對應時段的預約 (該時段已被刪除)
                                </h3>
                                <div className="space-y-3 max-h-60 overflow-y-auto pr-2 no-scrollbar">
                                    {orphanedReservations.map(res => (
                                        <div key={res.id} className="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-3 rounded sketchy-border-sm gap-2 shadow-sm">
                                            <div>
                                                <div className="font-bold text-slate-800 text-lg">{res.childName || res.name || '未命名'}</div>
                                                <div className="text-sm text-slate-600 mt-1">
                                                    <span className="bg-gray-200 px-2 py-0.5 rounded mr-2 font-bold">{res.venue}</span>
                                                    原預約時段：{res.date} {res.startTime}~{res.endTime}
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => handleDeleteOrphan(res)} 
                                                className="sketchy-btn sketchy-border-sm px-4 py-2 bg-red-500 text-white font-bold text-sm whitespace-nowrap"
                                            >
                                                刪除紀錄
                                            </button>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-3 text-sm text-red-600 font-bold">
                                    💡 這些預約因為您刪除了對應的開放時段，所以無法顯示在上方月曆中。您可以點擊「刪除紀錄」按鈕將它們清除。
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="space-y-8 pb-12">
                    {useLocalMode && (
                        <div className="bg-yellow-50 border-b-4 border-yellow-400 p-3 md:p-4 text-center sketchy-border-sm mx-4 mt-4 shadow-sm relative overflow-hidden">
                            <h3 className="text-xl font-bold text-yellow-800 mb-1">⚠️ 目前為「單機離線模式」</h3>
                            <p className="text-yellow-700 text-sm">因雲端權限設定未完成，資料暫存於瀏覽器中。請老師至 Firebase Console 修改設定喔！</p>
                        </div>
                    )}

                    {/* 老師專用：左側浮動登記簿 */}
                    {role === 'teacher' && (
                        <>
                            <div className={`fixed left-0 top-1/4 z-40 transition-transform duration-300 ${isAttendanceOpen ? '-translate-x-full' : 'translate-x-0'}`}>
                                <button onClick={() => setIsAttendanceOpen(true)} className="sketchy-btn bg-yellow-100 text-yellow-900 border-2 border-l-0 border-slate-800 font-bold py-3 px-2 rounded-r-xl shadow-md flex flex-col items-center gap-1">
                                    <span className="text-xl">📋</span>
                                    <span className="text-sm font-bold flex flex-col"><span>登</span><span>記</span><span>簿</span></span>
                                </button>
                            </div>

                            <div className={`fixed left-0 top-16 bottom-16 w-64 md:w-72 bg-white border-2 border-l-0 border-slate-800 rounded-r-2xl shadow-2xl z-40 flex flex-col transition-transform duration-300 ${isAttendanceOpen ? 'translate-x-0' : '-translate-x-full'}`}>

                                    <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">📋 預約點名簿</h3>

                                <div className="p-3 bg-slate-50 text-sm font-bold text-slate-700 text-center border-b border-slate-200">
                                    {teacherSelectedClass === '全部' ? '🌈 全部班級' : `【${teacherSelectedClass}】`}
                                    <br/>

                                </div>
                                <div className="flex-1 overflow-y-auto p-3 space-y-3 no-scrollbar bg-slate-50/50">
                                    {attendanceList.length === 0 ? (
                                        <div className="text-center text-slate-400 py-6 font-bold text-sm">目前尚無預約資料</div>
                                    ) : (
                                        attendanceList.map((child, idx) => (
                                            <div key={child.name} className="bg-white p-3 rounded-lg sketchy-border-sm text-sm shadow-sm relative hover:bg-blue-50 transition-colors">

                    <div className="text-center mt-6 mb-8">

                            <div className="absolute -bottom-2 left-0 w-full h-1 bg-slate-800 rounded-full opacity-70 transform -rotate-1"></div>

                                                        className="sketchy-border-sm w-full px-3 py-2 h-20 text-sm"
                                                        placeholder="例如：請記得戴口罩、準時抵達..."
                                                    />
                                                </div>
                                            </>
                                        )}
                                    </div>

                                    {teacherSelectedClass !== '全部' && (
                                        <div className="w-full md:w-1/2 bg-blue-50 p-4 sketchy-border-sm rounded-xl space-y-4">
                                            <h3 className="font-bold text-blue-800 text-lg">2. {isEditingSlot ? '修改可預約時段' : '新增可預約時段 (開放給家長選)'}</h3>
                                            <div>
                                                <label className="block text-sm font-bold text-slate-600">選擇日期</label>
                                                <input type="date" value={teacherSlotForm.date} onChange={e => setTeacherSlotForm({...teacherSlotForm, date: e.target.value})} className="sketchy-border-sm w-full px-2 py-1 bg-white" />
                                            </div>
                                            <div className="flex gap-2 items-end">
                                                <div className="flex-1">
                                                    <label className="block text-sm font-bold text-slate-600">開始時間 (24H)</label>
                                                    <div className="flex gap-1">
                                                        <select name="startHour" value={teacherSlotForm.startHour} onChange={handleTeacherStartChange} className="sketchy-border-sm px-1 py-1 flex-1 bg-white">
                                                            {Array.from({length:24}, (_,i)=>String(i).padStart(2,'0')).map(h=><option key={h} value={h}>{h}時</option>)}
                                                        </select>
                                                        <select name="startMin" value={teacherSlotForm.startMin} onChange={handleTeacherStartChange} className="sketchy-border-sm px-1 py-1 flex-1 bg-white">
                                                            <option value="00">00分</option><option value="30">30分</option>
                                                        </select>
                                                    </div>
                                                </div>
                                                <span className="font-bold pb-2">至</span>
                                                <div className="flex-1">
                                                    <label className="block text-sm font-bold text-slate-600">結束時間 (24H)</label>
                                                    <div className="flex gap-1">
                                                        <select value={teacherSlotForm.endHour} onChange={e => setTeacherSlotForm({...teacherSlotForm, endHour: e.target.value})} className="sketchy-border-sm px-1 py-1 flex-1 bg-white">
                                                            {Array.from({length:24}, (_,i)=>String(i).padStart(2,'0')).map(h=><option key={h} value={h}>{h}時</option>)}
                                                        </select>
                                                        <select value={teacherSlotForm.endMin} onChange={e => setTeacherSlotForm({...teacherSlotForm, endMin: e.target.value})} className="sketchy-border-sm px-1 py-1 flex-1 bg-white">
                                                            <option value="00">00分</option><option value="30">30分</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            {isEditingSlot ? (
                                                <div className="flex gap-2 mt-2">
                                                    <button onClick={handleAddSlots} className="sketchy-btn sketchy-border-sm flex-1 py-2 bg-slate-800 text-white font-bold">更新時段</button>
                                                    <button onClick={() => { setIsEditingSlot(false); setTeacherSlotForm({...teacherSlotForm, id: null}); }} className="sketchy-btn sketchy-border-sm px-4 py-2 bg-gray-200 text-slate-700 font-bold">取消</button>
                                                </div>
                                            ) : (
                                                <button onClick={handleAddSlots} className="sketchy-btn sketchy-border-sm w-full py-2 bg-slate-800 text-white font-bold mt-2">產生開放時段</button>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                            
                            {renderCalendarView('teacher', teacherSelectedClass)}
                        </div>
                    )}

                    {role === 'parent' && (
                        <div className="space-y-6">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-3xl font-bold text-slate-800">👨‍👩‍👧‍👦 家長預約專區</h2>
                                <button onClick={() => setRole(null)} className="sketchy-btn sketchy-border-sm px-4 py-2 bg-slate-200 font-bold">登出回首頁</button>
                            </div>

                            <div className="sketchy-border p-6 bg-white relative">
                                <form onSubmit={handleParentSubmit} className="space-y-6">
                                    <div className="flex flex-col md:flex-row gap-6">
                                        <div className="w-full md:w-1/2 space-y-4">
                                            <div>
                                                <label className="block text-lg font-bold mb-1 text-slate-700">1. 選擇小孩的班級</label>
                                                <select 
                                                    value={parentForm.venue} 
                                                    onChange={e => setParentForm({...parentForm, venue: e.target.value})} 
                                                    className="sketchy-border-sm w-full px-3 py-2 bg-yellow-50 text-xl font-bold"
                                                    disabled={isParentLocked}
                                                >
                                                    {CLASS_OPTIONS.map(c => <option key={c} value={c}>{c}</option>)}
                                                </select>
                                            </div>
                                            
                                            {(classSettings[parentForm.venue] || DEFAULT_CLASS_SETTINGS[parentForm.venue] || {}).notes && (
                                                <div className="bg-orange-50 border-l-4 border-orange-400 p-3 sketchy-border-sm">
                                                    <div className="font-bold text-orange-800 flex items-center gap-1"><span>📌</span> 老師叮嚀：</div>
                                                    <div className="text-sm text-orange-700 whitespace-pre-wrap">{(classSettings[parentForm.venue] || DEFAULT_CLASS_SETTINGS[parentForm.venue] || {}).notes}</div>
                                                </div>
                                            )}

                                            <div>
                                                <label className="block text-lg font-bold mb-1 text-slate-700">2. 填寫小孩姓名</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="例：王小明" 
                                                    value={parentForm.childName} 
                                                    onChange={e=>setParentForm({...parentForm, childName: e.target.value})} 
                                                    className="sketchy-border-sm w-full px-4 py-2 text-xl" 
                                                    required 
                                                    disabled={isParentLocked}
                                                />
                                            </div>

                                            {!isParentLocked ? (
                                                <button type="button" onClick={() => {
                                                    if (!parentForm.childName.trim()) return showAlert("請輸入小孩的名字喔！");
                                                    setIsParentLocked(true);
                                                }} className="sketchy-btn sketchy-border-sm w-full py-3 bg-blue-600 text-white font-bold text-xl mt-4">
                                                    確認身分並開始預約
                                                </button>
                                            ) : (
                                                <div className="mt-4 p-4 bg-blue-50 border border-blue-200 rounded sketchy-border-sm">
                                                    <div className="text-blue-800 font-bold mb-1">👤 預約姓名：{childNameTrimmed}</div>
                                                    <div className="text-blue-700 text-sm font-medium">
                                                        目前已預約：<span className="text-lg font-bold">{parentBookingsCount}</span> / {currentParentSettings.maxPerParent === 999 ? '不限' : currentParentSettings.maxPerParent} 個時段
                                                    </div>
                                                    <button type="button" onClick={() => {
                                                        setIsParentLocked(false);
                                                        setParentForm(prev => ({...prev, slotId: '', date: ''}));
                                                    }} className="sketchy-btn sketchy-border-sm w-full py-2 bg-white text-slate-700 font-bold mt-3">
                                                        重新修改班級或姓名
                                                    </button>
                                                </div>
                                            )}
                                        </div>

                                        {isParentLocked ? (
                                            <div className="w-full md:w-1/2 bg-green-50 p-4 sketchy-border-sm rounded-xl space-y-4 flex flex-col justify-center">
                                                <h3 className="font-bold text-green-800 text-lg">3. 選擇預約時段</h3>
                                                
                                                {availableDates.length === 0 ? (
                                                    <div className="text-center text-slate-500 py-4 font-bold">老師尚未開放任何預約時段喔！</div>
                                                ) : (
                                                    <>
                                                        <div>
                                                            <label className="block text-sm font-bold text-slate-600 mb-1">預約日期</label>
                                                            <select value={parentForm.date} onChange={e => setParentForm({...parentForm, date: e.target.value})} className="sketchy-border-sm w-full px-3 py-2 bg-white font-bold">
                                                                {availableDates.map(d => <option key={d} value={d}>{d}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="block text-sm font-bold text-slate-600 mb-1">預約時間</label>
                                                            <select value={parentForm.slotId} onChange={e => setParentForm({...parentForm, slotId: e.target.value})} className="sketchy-border-sm w-full px-3 py-2 bg-white font-bold text-slate-800">
                                                                <option value="" disabled>-- 請選擇時段 --</option>
                                                                {availableSlotsForDate.map(slot => (
                                                                    <option key={slot.id} value={slot.id} disabled={slot.remaining <= 0}>
                                                                        {slot.startTime} ~ {slot.endTime} (已預約 {slot.bookedCount} / 剩餘 {slot.remaining})
                                                                    </option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                        <button 
                                                            type="button" 
                                                            onClick={handleParentSubmit} 
                                                            disabled={isSubmitting}
                                                            className="sketchy-btn sketchy-border-sm w-full py-3 bg-slate-800 text-white font-bold text-xl mt-4"
                                                        >
                                                            {isSubmitting ? '處理中...' : '送出預約！'}
                                                        </button>
                                                    </>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="w-full md:w-1/2 bg-gray-50 p-4 sketchy-border-sm rounded-xl space-y-4 flex flex-col justify-center items-center text-gray-400">
                                                <span className="text-4xl mb-2">🔒</span>
                                                <p className="font-bold">請先於左側輸入姓名並點擊確認</p>
                                            </div>
                                        )}
                                    </div>
                                </form>
                            </div>
                            
                            {isParentLocked && renderCalendarView('parent', parentForm.venue)}
                        </div>
                    )}

                    {/* 共用 Dialog */}
                    {dialog.isOpen && (
                        <div className="fixed inset-0 bg-slate-900 bg-opacity-40 flex items-center justify-center z-50 px-4">
                            <div className="bg-white p-6 md:p-8 rounded-2xl sketchy-border max-w-sm w-full shadow-2xl transform scale-100 transition-transform">
                                <h3 className="text-2xl font-bold text-slate-800 mb-4">
                                    {dialog.type === 'confirm' ? '🤔 請確認' : dialog.type === 'pin' ? '🔐 權限驗證' : dialog.type === 'show-pin' ? '🎉 預約成功' : '💡 提示'}
                                </h3>
                                {dialog.type !== 'show-pin' && <div className="text-xl text-slate-600 mb-6 whitespace-pre-wrap leading-relaxed">{dialog.message}</div>}
                                {dialog.type === 'show-pin' && (
                                    <div className="mb-6 text-slate-600">
                                        <div className="text-xl whitespace-pre-wrap leading-relaxed mb-4">{dialog.message}</div>
                                        <div className="flex items-center justify-center gap-4 bg-slate-100 p-4 rounded-xl sketchy-border-sm mb-4">
                                            <span className="text-4xl font-bold tracking-[0.2em] text-slate-800">{dialog.pinToCopy}</span>
                                            <button onClick={() => { copyToClipboard(dialog.pinToCopy); setIsCopied(true); setTimeout(() => setIsCopied(false), 2000); }} className={`sketchy-btn sketchy-border-sm px-4 py-2 font-bold text-md transition-colors ${isCopied ? 'bg-green-600 text-white' : 'bg-slate-800 text-white'}`}>{isCopied ? '已複製 ✓' : '複製'}</button>
                                        </div>
                                        <div className="text-md text-red-600 font-bold whitespace-pre-wrap leading-relaxed">{dialog.warning}</div>
                                    </div>
                                )}
                                {dialog.type === 'pin' && (
                                    <div className="flex flex-col items-center">
                                        <input type="text" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="請輸入密碼" className="sketchy-border-sm w-full px-4 py-2 text-2xl mb-4 text-center tracking-[0.5em] font-bold text-slate-700 bg-slate-50" />
                                    </div>
                                )}
                                <div className="flex justify-end gap-3">
                                    {(dialog.type === 'confirm' || dialog.type === 'pin') && <button onClick={() => setDialog({ ...dialog, isOpen: false })} className="sketchy-btn sketchy-border-sm px-5 py-2 bg-gray-100 text-slate-700 font-bold text-lg">取消</button>}
                                    <button onClick={() => {
                                        if (dialog.type === 'pin') {
                                            if (String(pinInput) === String(dialog.expectedPin) || String(pinInput) === "8888") {
                                                if (dialog.onConfirm) dialog.onConfirm(); setDialog({ ...dialog, isOpen: false });
                                            } else { setDialog({ isOpen: true, message: '❌ 密碼錯誤！\n請重新確認後再試。', type: 'alert', onConfirm: null }); }
                                        } else {
                                            if (dialog.onConfirm) dialog.onConfirm(); setDialog({ ...dialog, isOpen: false });
                                        }
                                    }} className="sketchy-btn sketchy-border-sm px-5 py-2 bg-slate-800 text-white font-bold text-lg">確定</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
