                                                const allDates = Array.from(allDatesSet).sort();

                                                if (allDates.length === 0) return <div className="text-slate-400 font-bold p-4 w-full text-center">請先載入預約，或新增開放時段喔！</div>;

                                                return allDates.map(date => {
                                                    const slotsForDate = [];
                                                    const slotMap = new Map();
                                                    
                                                    (cSet.slots || []).forEach(s => {
                                                        if (s.date === date) {
                                                            const key = `${s.startTime}-${s.endTime}`;
                                                            if (!slotMap.has(key)) {
                                                                slotMap.set(key, s);
                                                                slotsForDate.push(s);
                                                            }
                                                        }
                                                    });
                                                    
                                                    bData.forEach(r => {
                                                        if (r.date === date) {
                                                            const key = `${r.startTime}-${r.endTime}`;
                                                            if (!slotMap.has(key)) {
                                                                const newSlot = { date: r.date, startTime: r.startTime, endTime: r.endTime, id: `orphaned_${key}` };
                                                                slotMap.set(key, newSlot);
                                                                slotsForDate.push(newSlot);
                                                            }
                                                        }
                                                    });
                                                    slotsForDate.sort((a,b) => a.startTime.localeCompare(b.startTime));

                                                    // 使用 calc(33.333% - 16px) 來保證大螢幕下完美呈現 3 欄
                                                    return (
                                                        <div key={date} className="w-full md:w-[calc(50%-12px)] lg:w-[calc(33.333%-16px)] flex-none bg-slate-100 p-4 rounded-xl sketchy-border-sm flex flex-col">
                                                            <div className="text-center font-black text-2xl text-slate-800 border-b-2 border-slate-300 pb-2 mb-4">
                                                                📅 {date}
                                                            </div>
                                                            <div className="flex-1 space-y-4">
                                                                {slotsForDate.map(slot => {
                                                                    const cards = bData.filter(r => r.date === slot.date && r.startTime === slot.startTime);
                                                                    const isConflict = cards.length > 1;
                                                                    const isBestChoice = cards.length === 1;

                                                                    return (
                                                                        <div 
                                                                            key={`${slot.date}_${slot.startTime}`}
                                                                            className={`p-3 rounded-lg sketchy-border-sm flex flex-col ${isConflict ? 'bg-red-100 border-red-400 border-2' : isBestChoice ? 'bg-green-50 border-green-400 border-2' : 'bg-white border border-slate-300'}`}
                                                                            onDragOver={e => e.preventDefault()}
                                                                            onDrop={e => handleBoardDrop(e, slot)}
                                                                        >
                                                                            <div className="text-center font-bold mb-2">
                                                                                <span className="text-blue-700 bg-blue-50 px-2 py-1 rounded-full text-sm border border-blue-200">
                                                                                    🕒 {slot.startTime} ~ {slot.endTime}
                                                                                </span>
                                                                            </div>
                                                                            {isConflict && <div className="text-xs bg-red-200 text-red-700 font-bold text-center mb-2 py-1 rounded animate-pulse">⚠️ 衝突！請協調移開 (共 {cards.length} 人)</div>}
                                                                            <div className="flex-1 space-y-2 min-h-[60px]">
                                                                                {cards.map(card => {
                                                                                    return (
                                                                                        <div
                                                                                            key={card.id}
                                                                                            draggable
                                                                                            onDragStart={e => handleBoardDragStart(e, card.id)}
                                                                                            className={`p-2 rounded shadow-sm cursor-grab active:cursor-grabbing relative group ${isBestChoice ? 'border-2 border-yellow-500 shadow-md' : 'border border-slate-300'}`}
                                                                                            style={{ backgroundColor: card.color || getColorForName(card.childName || card.name) }}
                                                                                        >
                                                                                            <div className="font-bold text-slate-800 text-base pr-6">{card.childName || card.name || '未命名'}</div>
                                                                                            {isBestChoice && <div className="mt-1 text-[10px] bg-yellow-400 text-yellow-900 px-1.5 py-0.5 rounded inline-block font-bold shadow-sm">⭐ 該小孩的最佳選取時段</div>}
                                                                                            <button onClick={() => handleBoardDeleteRes(card.id)} className="absolute top-1 right-1 text-slate-400 hover:text-red-500 font-bold w-5 h-5 flex items-center justify-center bg-white/70 hover:bg-red-100 rounded-full transition-colors opacity-0 group-hover:opacity-100 border border-slate-200" title="刪除此紀錄">×</button>
                                                                                        </div>
                                                                                    )
                                                                                })}
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                });
                                            })()}
                                        </div>
                                    </div>
                                    
                                    <div className="text-slate-500 font-bold text-sm text-center mt-2">
                                        💡 提示：按住小孩的卡片拖曳到其他格子即可排班！<br/>如果某個時段只有一位小孩，系統會自動標示為「⭐ 該小孩的最佳選取時段」，建議優先保留給他喔！
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {role === 'parent' && (
                        <div className="space-y-6">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-3xl font-bold text-slate-800">👨‍👩‍👧‍👦 家長預約專區</h2>
                                <button onClick={() => setRole(null)} className="sketchy-btn sketchy-border-sm px-4 py-2 bg-slate-200 font-bold">登出回首頁</button>
                            </div>

                            {/* 目的與截止日期 醒目橫幅 */}
                            <div className="text-center mb-8 bg-orange-50 p-6 rounded-2xl sketchy-border border-orange-300">
                                <h2 className="text-4xl md:text-5xl font-black text-orange-600 mb-3 tracking-wide">{currentParentSettings.purpose || '預約活動'}</h2>
                                {currentParentSettings.deadline && (
                                    <p className="text-xl md:text-2xl font-bold text-red-600 bg-white inline-block px-4 py-1 rounded-full border-2 border-red-200 shadow-sm">
                                        ⏳ 預約截止日期：{currentParentSettings.deadline}
                                    </p>
                                )}
                            </div>

                            <div className="sketchy-border p-6 bg-white relative">
                                <form onSubmit={handleParentSubmit} className="space-y-6">
                                    <div className="flex flex-col md:flex-row gap-6">
                                        <div className="w-full md:w-1/2 space-y-4">
                                            
                                            <div>
                                                <label className="block text-lg font-bold mb-1 text-slate-700">1. 選擇班級與預約目的</label>
                                                <div className="flex flex-col gap-2">
                                                    <select 
                                                        value={parentForm.venue} 
                                                        onChange={e => setParentForm({...parentForm, venue: e.target.value})} 
                                                        className="sketchy-border-sm w-full px-3 py-2 bg-yellow-50 text-xl font-bold"
                                                        disabled={isParentLocked}
                                                    >
                                                        {CLASS_OPTIONS.map(c => <option key={c} value={c}>{c}</option>)}
                                                    </select>
                                                    <select 
                                                        value={parentForm.purpose} 
                                                        onChange={e => setParentForm({...parentForm, purpose: e.target.value})} 
                                                        className="sketchy-border-sm w-full px-3 py-2 bg-blue-50 text-xl font-bold"
                                                        disabled={isParentLocked}
                                                    >
                                                        {(() => {
                                                            const todayStr = formatDate(new Date());
                                                            const validPurposes = Object.keys((classSettings[parentForm.venue] || {}).purposes || {}).filter(p => {
                                                                const pSet = classSettings[parentForm.venue].purposes[p];
                                                                return !pSet.deadline || pSet.deadline >= todayStr;
                                                            });
                                                            
                                                            if (validPurposes.length === 0) {
                                                                return <option value="" disabled>目前無開放預約</option>;
                                                            }
                                                            return validPurposes.map(p => (
                                                                <option key={p} value={p}>{p}</option>
                                                            ));
                                                        })()}
                                                    </select>
                                                </div>
                                            </div>

                                            {currentParentSettings.notes && (
                                                <div className="bg-orange-50 border-l-4 border-orange-400 p-3 sketchy-border-sm">
                                                    <div className="font-bold text-orange-800 flex items-center gap-1"><span>📌</span> 老師叮嚀：</div>
                                                    <div className="text-sm text-orange-700 whitespace-pre-wrap">{currentParentSettings.notes}</div>
                                                </div>
                                            )}

                                            <div>
                                                <label className="block text-lg font-bold mb-1 text-slate-700">2. 填寫小孩姓名</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="例：王小明" 
                                                    value={parentForm.childName} 
                                                    onChange={e=>setParentForm({...parentForm, childName: e.target.value})} 
                                                    className="sketchy-border-sm w-full px-4 py-2 text-xl" 
                                                    required 
                                                    disabled={isParentLocked}
                                                />
                                            </div>

                                            {!isParentLocked ? (
                                                <button type="button" onClick={() => {
                                                    if (!parentForm.purpose) return showAlert("請先選擇預約目的喔！");
                                                    if (!parentForm.childName.trim()) return showAlert("請輸入小孩的名字喔！");
                                                    setIsParentLocked(true);
                                                }} className="sketchy-btn sketchy-border-sm w-full py-3 bg-blue-600 text-white font-bold text-xl mt-4">
                                                    確認身分並開始預約
                                                </button>
                                            ) : (
                                                <div className="mt-4 p-4 bg-blue-50 border border-blue-200 rounded sketchy-border-sm">
                                                    <div className="text-blue-800 font-bold mb-1">👤 預約姓名：{childNameTrimmed}</div>
                                                    <div className="text-blue-700 text-sm font-medium">
                                                        目前已預約：<span className="text-lg font-bold">{parentBookingsCount}</span> / {currentParentSettings.maxPerParent === 999 ? '不限' : currentParentSettings.maxPerParent} 個時段
                                                    </div>
                                                    <button type="button" onClick={() => {
                                                        setIsParentLocked(false);
                                                        setParentForm(prev => ({...prev, slotId: '', date: ''}));
                                                    }} className="sketchy-btn sketchy-border-sm w-full py-2 bg-white text-slate-700 font-bold mt-3">
                                                        重新修改班級或姓名
                                                    </button>
                                                </div>
                                            )}
                                        </div>

                                        {isParentLocked ? (
                                            <div className="w-full md:w-1/2 bg-green-50 p-4 sketchy-border-sm rounded-xl space-y-4 flex flex-col justify-center">
                                                <h3 className="font-bold text-green-800 text-lg">3. 選擇預約時段</h3>
                                                
                                                {availableDates.length === 0 ? (
                                                    <div className="text-center text-slate-500 py-4 font-bold">目前尚未開放任何預約時段喔！</div>
                                                ) : (
                                                    <>
                                                        <div>
                                                            <label className="block text-sm font-bold text-slate-600 mb-1">預約日期</label>
                                                            <select value={parentForm.date} onChange={e => setParentForm({...parentForm, date: e.target.value})} className="sketchy-border-sm w-full px-3 py-2 bg-white font-bold">
                                                                <option value="" disabled>-- 請先選擇日期 --</option>
                                                                {availableDates.map(d => <option key={d} value={d}>{d}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="block text-sm font-bold text-slate-600 mb-1">預約時間</label>
                                                            <select value={parentForm.slotId} onChange={e => setParentForm({...parentForm, slotId: e.target.value})} className="sketchy-border-sm w-full px-3 py-2 bg-white font-bold text-slate-800">
                                                                <option value="" disabled>-- 請選擇時段 --</option>
                                                                {availableSlotsForDate.map(slot => (
                                                                    <option key={slot.id} value={slot.id}>
                                                                        {slot.startTime} ~ {slot.endTime}
                                                                    </option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                        <button 
                                                            type="button" 
                                                            onClick={handleParentSubmit} 
                                                            disabled={isSubmitting}
                                                            className="sketchy-btn sketchy-border-sm w-full py-3 bg-slate-800 text-white font-bold text-xl mt-4"
                                                        >
                                                            {isSubmitting ? '處理中...' : '送出預約！'}
                                                        </button>
                                                    </>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="w-full md:w-1/2 bg-gray-50 p-4 sketchy-border-sm rounded-xl space-y-4 flex flex-col justify-center items-center text-gray-400">
                                                <span className="text-4xl mb-2">🔒</span>
                                                <p className="font-bold">請先於左側輸入姓名並點擊確認</p>
                                            </div>
                                        )}
                                    </div>
                                </form>
                            </div>
                            
                            {isParentLocked && (
                                <>
                                    {/* 目的與截止日期 醒目橫幅 */}
                                    <div className="text-center mt-8 mb-6 relative">
                                        <div className="bg-orange-50 inline-block p-4 md:p-6 rounded-2xl sketchy-border border-orange-300 w-full max-w-2xl shadow-lg">
                                            <h2 className="text-4xl md:text-5xl font-black text-orange-600 mb-2 tracking-wide leading-tight">{parentForm.purpose || '預約活動'}</h2>
                                            {currentParentSettings.deadline && (
                                                <div className="text-lg md:text-2xl font-bold text-red-600 bg-white inline-block px-5 py-2 rounded-full border-2 border-red-200 shadow-sm mt-2">
                                                    ⏳ 預約截止日：{currentParentSettings.deadline}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    
                                    {/* 倒數計時 */}
                                    {(() => {
                                        if (!currentParentSettings.deadline) return null;
                                        const today = new Date();
                                        today.setHours(0,0,0,0);
                                        const dlDate = new Date(currentParentSettings.deadline);
                                        dlDate.setHours(0,0,0,0);
                                        const diffDays = Math.ceil((dlDate - today) / 86400000);
                                        
                                        return (
                                            <div className="text-center mb-6">
                                                {diffDays < 0 ? (
                                                    <span className="bg-red-600 text-white font-black text-xl md:text-2xl px-6 py-2 rounded-full sketchy-border-sm shadow-md animate-pulse">⚠️ 預約已截止</span>
                                                ) : diffDays === 0 ? (
                                                    <span className="bg-orange-500 text-white font-black text-xl md:text-2xl px-6 py-2 rounded-full sketchy-border-sm shadow-md animate-pulse">⏳ 今天是最後一天！</span>
                                                ) : (
                                                    <span className="bg-green-500 text-white font-black text-xl md:text-2xl px-6 py-2 rounded-full sketchy-border-sm shadow-md animate-subtle-bounce inline-block">⏳ 距離結束還有 {diffDays} 天！</span>
                                                )}
                                            </div>
                                        );
                                    })()}
                                    
                                    {renderCalendarView('parent', parentForm.venue, parentForm.purpose)}
                                </>
                            )}
                        </div>
                    )}

                    {/* 共用 Dialog */}
                    {dialog.isOpen && (
                        <div className={`fixed inset-0 bg-slate-900 bg-opacity-40 flex items-center justify-center z-50 px-4`}>
                            <div className={`bg-white p-6 md:p-8 rounded-2xl sketchy-border w-full shadow-2xl transform scale-100 transition-transform ${dialog.type === 'gas' ? 'max-w-2xl' : 'max-w-sm'}`}>
                                <h3 className="text-2xl font-bold text-slate-800 mb-4">
                                    {dialog.type === 'confirm' ? '🤔 請確認' : dialog.type === 'pin' ? '🔐 權限驗證' : dialog.type === 'show-pin' ? '🎉 預約成功' : dialog.type === 'gas' ? '📜 產生 GAS 腳本' : dialog.type === 'prompt' ? '📝 新增項目' : dialog.type === 'choose-assignment' ? '🎯 選擇排班方案' : '💡 提示'}
                                </h3>
                                
                                {dialog.type !== 'show-pin' && dialog.type !== 'gas' && dialog.type !== 'choose-assignment' && <div className="text-xl text-slate-600 mb-6 whitespace-pre-wrap leading-relaxed">{dialog.message}</div>}
                                
                                {dialog.type === 'show-pin' && (
                                    <div className="mb-6 text-slate-600">
                                        <div className="text-xl whitespace-pre-wrap leading-relaxed mb-4">{dialog.message}</div>
                                        <div className="flex items-center justify-center gap-4 bg-slate-100 p-4 rounded-xl sketchy-border-sm mb-4">
                                            <span className="text-4xl font-bold tracking-[0.2em] text-slate-800">{dialog.pinToCopy}</span>
                                            <button onClick={() => { copyToClipboard(dialog.pinToCopy); setIsCopied(true); setTimeout(() => setIsCopied(false), 2000); }} className={`sketchy-btn sketchy-border-sm px-4 py-2 font-bold text-md transition-colors ${isCopied ? 'bg-green-600 text-white' : 'bg-slate-800 text-white'}`}>{isCopied ? '已複製 ✓' : '複製'}</button>
                                        </div>
                                        <div className="text-md text-red-600 font-bold whitespace-pre-wrap leading-relaxed">{dialog.warning}</div>
                                    </div>
                                )}

                                {dialog.type === 'gas' && (
                                    <div className="flex flex-col items-center w-full mb-6">
                                        <div className="text-sm text-slate-600 mb-2 w-full font-bold">
                                            {dialog.message}
                                        </div>
                                        <textarea
                                            readOnly
                                            value={dialog.gasCode}
                                            className="sketchy-border-sm w-full p-3 h-48 text-xs font-mono bg-slate-50 whitespace-pre"
                                        />
                                        <button onClick={() => { copyToClipboard(dialog.gasCode); setIsCopied(true); setTimeout(() => setIsCopied(false), 2000); }} className={`mt-3 sketchy-btn sketchy-border-sm px-4 py-2 font-bold text-sm transition-colors ${isCopied ? 'bg-green-600 text-white' : 'bg-slate-800 text-white'}`}>
                                            {isCopied ? '已複製 ✓' : '複製代碼'}
                                        </button>
                                    </div>
                                )}

                                {dialog.type === 'pin' && (
                                    <div className="flex flex-col items-center">
                                        <input type="text" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="請輸入密碼" className="sketchy-border-sm w-full px-4 py-2 text-2xl mb-4 text-center tracking-[0.5em] font-bold text-slate-700 bg-slate-50" />
                                    </div>
                                )}
                                
                                {dialog.type === 'prompt' && (
                                    <div className="flex flex-col items-center w-full mb-4">
                                        <input type="text" value={promptInput} onChange={(e) => setPromptInput(e.target.value)} placeholder="請輸入名稱" className="sketchy-border-sm w-full px-4 py-2 text-xl text-center font-bold text-slate-700 bg-slate-50" />
                                    </div>
                                )}

                                {dialog.type === 'choose-assignment' && (
                                    <div className="flex flex-col items-center w-full mb-6">
                                        <div className="text-lg text-slate-700 font-bold mb-4 w-full text-left">
                                            系統分析出共 <span className="text-3xl text-blue-600 mx-1">{dialog.totalCount >= 1000 ? '1000+' : dialog.totalCount}</span> 種「零衝突」完美組合！
                                            <br/><span className="text-sm text-slate-500 mt-1 inline-block">(為方便選擇，已為您列出前 {dialog.solutions?.length} 種方案)</span>
                                        </div>
                                        <div className="flex flex-col gap-3 w-full max-h-[40vh] overflow-y-auto no-scrollbar pr-2 pb-2">
                                            {dialog.solutions?.map((sol, idx) => (
                                                <button
                                                    key={idx}
                                                    onClick={() => {
                                                        updatePurposeSetting('boardData', sol);
                                                        setDialog({ ...dialog, isOpen: false });
                                                        showAlert(`✨ 已成功套用「排班方案 ${idx + 1}」！\n您可以直接在排班板預覽看看這個版本是否滿意。`);
                                                    }}
                                                    className="sketchy-btn sketchy-border-sm w-full py-3 bg-blue-50 hover:bg-blue-100 text-blue-800 font-bold text-lg flex justify-between px-6 items-center"
                                                >
                                                    <span>方案 {idx + 1}</span>
                                                    <span className="text-sm bg-white px-2 py-1 rounded sketchy-border-sm">👉 點擊套用</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="flex justify-end gap-3">
                                    {(dialog.type === 'confirm' || dialog.type === 'pin' || dialog.type === 'prompt' || dialog.type === 'choose-assignment') && <button onClick={() => setDialog({ ...dialog, isOpen: false })} className="sketchy-btn sketchy-border-sm px-5 py-2 bg-gray-100 text-slate-700 font-bold text-lg">取消</button>}
                                    
                                    {dialog.type === 'gas' ? (
                                        <button onClick={() => setDialog({ ...dialog, isOpen: false })} className="sketchy-btn sketchy-border-sm px-5 py-2 bg-slate-800 text-white font-bold text-lg">關閉</button>
                                    ) : (
                                        <button onClick={() => {
                                            if (dialog.type === 'pin') {
                                                if (String(pinInput) === String(dialog.expectedPin) || String(pinInput) === "8888") {
                                                    if (dialog.onConfirm) dialog.onConfirm(); setDialog({ ...dialog, isOpen: false });
                                                } else { setDialog({ isOpen: true, message: '❌ 密碼錯誤！\n請重新確認後再試。', type: 'alert', onConfirm: null }); }
                                            } else if (dialog.type === 'prompt') {
                                                if (promptInput && promptInput.trim()) {
                                                    if (dialog.onConfirm) dialog.onConfirm(promptInput.trim());
                                                    setDialog({ ...dialog, isOpen: false });
                                                } else { 
                                                    setDialog({ isOpen: true, message: '❌ 名稱不能為空！\n請重新操作。', type: 'alert', onConfirm: null }); 
                                                }
                                            } else {
                                                if (dialog.onConfirm) dialog.onConfirm(); setDialog({ ...dialog, isOpen: false });
                                            }
                                        }} className="sketchy-btn sketchy-border-sm px-5 py-2 bg-slate-800 text-white font-bold text-lg">確定</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
