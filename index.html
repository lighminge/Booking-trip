<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手繪白板風 - 行程預約系統 (親師版)</title>
    
    <!-- 引入 React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 讓瀏覽器解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 改用 Firebase Compat CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    
    <!-- 引入 html2canvas 供匯出圖片使用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- 引入 Google Fonts: Kalam -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kalam', cursive, sans-serif;
            background-color: #f0f0f0;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333;
        }
        .sketchy-border {
            border: 3px solid #2c3e50;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background-color: white;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        .sketchy-border-sm {
            border: 2px solid #2c3e50;
            border-radius: 15px 225px 15px 255px/255px 15px 225px 15px;
            background-color: white;
        }
        input, select, textarea {
            font-family: 'Kalam', cursive, sans-serif;
            font-size: 1.1rem;
            outline: none;
            background-color: transparent;
        }
        input:focus, textarea:focus {
            background-color: #fdfbf7;
        }
        .sketchy-btn:hover:not(:disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.15);
            border-radius: 15px 255px 15px 225px/225px 15px 255px 15px;
        }
        .sketchy-btn:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }
        .sketchy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .calendar-cell {
            border-right: 2px solid #e2e8f0;
            border-bottom: 2px solid #e2e8f0;
            min-height: 120px;
        }
        .calendar-grid {
            border: 3px solid #2c3e50;
            border-radius: 20px 10px 30px 15px/15px 30px 10px 20px;
            overflow: hidden;
            background: white;
        }
        .reservation-note {
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 2px 15px 5px 10px/10px 5px 15px 2px;
            box-shadow: 2px 2px 3px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .reservation-note:hover {
            transform: scale(1.02) rotate(-1deg);
            z-index: 10;
        }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
            cursor: pointer;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 倒數計時動畫 */
        @keyframes subtle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-subtle-bounce { animation: subtle-bounce 2s infinite; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- 放寬最大寬度，讓排班板能完美呈現三欄 -->
    <div id="root" class="max-w-7xl mx-auto w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Firebase 初始化 ---
        const firebaseConfig = {
            apiKey: "AIzaSyB9zuKL8Gbd_qYhyeqwpzCRG20VN2qrjns",
            authDomain: "gemini-db-3e10f.firebaseapp.com",
            projectId: "gemini-db-3e10f",
            storageBucket: "gemini-db-3e10f.firebasestorage.app",
            messagingSenderId: "951641571820",
            appId: "1:951641571820:web:0e6d134ee48536feaa80c9",
            measurementId: "G-FP4EL2V8PG"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // V3 架構升級：使用全新的集合名稱，避免與舊資料衝突
        const dbReservations = db.collection('reservations_v3');
        const dbSettings = db.collection('settings').doc('global_classes_v3');

        const LOCAL_RES_KEY = 'my_standalone_reservations_v3';
        const LOCAL_SET_KEY = 'my_standalone_class_settings_v3';

        // --- 工具函數與常數區 ---
        const CLASS_OPTIONS = ['🐻 小熊班', '🐧 企鵝班', '⭐ 星星班', '☀️ 太陽班', '❄️ 雪花班', '☁️ 白雲班'];
        
        const formatDate = (date) => {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            const year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        };

        const DEFAULT_PURPOSE_SETTINGS = {
            deadline: formatDate(new Date(Date.now() + 14 * 24 * 60 * 60 * 1000)),
            maxPerParent: 999, 
            duration: 60, 
            notes: '歡迎家長預約，請準時抵達喔！', 
            slots: [],
            boardData: [],
            publishedData: [],
            isPublished: false
        };

        const DEFAULT_CLASS_SETTINGS = CLASS_OPTIONS.reduce((acc, c) => {
            acc[c] = { purposes: { '親師座談會': { ...DEFAULT_PURPOSE_SETTINGS } } };
            return acc;
        }, {});

        const pastelColors = ['#FFB3BA', '#FFDFBA', '#FFFFBA', '#BAFFC9', '#BAE1FF', '#E8BAFF', '#FFBAFF', '#D4F0F0', '#F3E8FF', '#FEE2E2'];
        const getColorForName = (name) => {
            if (!name) return '#ffffff';
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return pastelColors[Math.abs(hash) % pastelColors.length];
        };

        const addMinutes = (timeStr, mins) => {
            const [h, m] = timeStr.split(':').map(Number);
            const date = new Date(2000, 1, 1, h, m + Number(mins));
            return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        };

        // --- 主程式區 ---
        const App = () => {
            // 全域狀態管理
            const [role, setRole] = useState(null); 
            const [reservations, setReservations] = useState([]);
            const [classSettings, setClassSettings] = useState(DEFAULT_CLASS_SETTINGS);
            const [currentDate, setCurrentDate] = useState(new Date());
            const [useLocalMode, setUseLocalMode] = useState(false);
            
            // 老師專區狀態
            const [teacherSelectedClass, setTeacherSelectedClass] = useState(CLASS_OPTIONS[0]);
            const [teacherSelectedPurpose, setTeacherSelectedPurpose] = useState('親師座談會');
            const [teacherActiveTab, setTeacherActiveTab] = useState('settings');
            const [teacherSlotForm, setTeacherSlotForm] = useState({ id: null, date: formatDate(new Date()), startHour: '09', startMin: '00', endHour: '10', endMin: '00' });
            const [isEditingSlot, setIsEditingSlot] = useState(false);
            const [teacherLocalNote, setTeacherLocalNote] = useState('');
            const [isAttendanceOpen, setIsAttendanceOpen] = useState(false);

            // 家長專區狀態
            const [parentForm, setParentForm] = useState({ childName: '', venue: CLASS_OPTIONS[0], purpose: '', date: '', slotId: '' });
            const [isParentLocked, setIsParentLocked] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isReservationSlipOpen, setIsReservationSlipOpen] = useState(false);
            const [isNotificationOpen, setIsNotificationOpen] = useState(false);
            
            // 未讀通知追蹤狀態
            const [hasUnreadNotification, setHasUnreadNotification] = useState(false);
            const [prevNotifCount, setPrevNotifCount] = useState(0);

            // 對話框狀態
            const [dialog, setDialog] = useState({ isOpen: false, message: '', type: 'alert', onConfirm: null, expectedPin: '', pinToCopy: '', warning: '', gasCode: '' });
            const [pinInput, setPinInput] = useState('');
            const [promptInput, setPromptInput] = useState('');
            const [isCopied, setIsCopied] = useState(false);

            // 計算目前選取目的的時段總數 (供老師查看)
            const currentPurposeSlotsCount = useMemo(() => {
                if (teacherSelectedClass === '全部' || teacherSelectedPurpose === '全部') return 0;
                return (((classSettings[teacherSelectedClass] || {}).purposes || {})[teacherSelectedPurpose] || {}).slots?.length || 0;
            }, [classSettings, teacherSelectedClass, teacherSelectedPurpose]);

            // 確保老師選擇的目的正確連動
            useEffect(() => {
                if (teacherSelectedClass !== '全部') {
                    const purposes = Object.keys((classSettings[teacherSelectedClass] || {}).purposes || {});
                    if (!purposes.includes(teacherSelectedPurpose)) {
                        setTeacherSelectedPurpose(purposes.length > 0 ? purposes[0] : '');
                    }
                } else {
                    setTeacherSelectedPurpose('全部');
                }
            }, [teacherSelectedClass, classSettings]);

            // 確保家長選擇的目的正確連動
            useEffect(() => {
                const purposes = Object.keys((classSettings[parentForm.venue] || {}).purposes || {});
                if (!purposes.includes(parentForm.purpose)) {
                    setParentForm(prev => ({ ...prev, purpose: purposes.length > 0 ? purposes[0] : '', slotId: '', date: '' }));
                }
            }, [parentForm.venue, classSettings]);

            // 同步老師備註欄位
            useEffect(() => {
                if (teacherSelectedClass === '全部' || teacherSelectedPurpose === '全部') {
                    setTeacherLocalNote('');
                    return;
                }
                const currentSets = ((classSettings[teacherSelectedClass] || {}).purposes || {})[teacherSelectedPurpose] || {};
                setTeacherLocalNote(currentSets.notes || '');
            }, [classSettings, teacherSelectedClass, teacherSelectedPurpose]);

            const calendarDays = useMemo(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const days = [];
                for (let i = 0; i < firstDay.getDay(); i++) days.unshift({ date: new Date(year, month, -i), isCurrentMonth: false });
                for (let i = 1; i <= lastDay.getDate(); i++) days.push({ date: new Date(year, month, i), isCurrentMonth: true });
                const remainingCells = 42 - days.length;
                for (let i = 1; i <= remainingCells; i++) days.push({ date: new Date(year, month + 1, i), isCurrentMonth: false });
                return days;
            }, [currentDate]);

            const mySavedPins = useMemo(() => {
                try { return JSON.parse(localStorage.getItem('my_reservation_pins_v3') || '{}'); } catch(e) { return {}; }
            }, [reservations]);

            const childNameTrimmed = (parentForm.childName || '').trim();
            const parentBookingsCount = useMemo(() => {
                if (!childNameTrimmed || !parentForm.purpose) return 0;
                return reservations.filter(r => r.venue === parentForm.venue && r.purpose === parentForm.purpose && (r.childName || r.name || '').trim() === childNameTrimmed).length;
            }, [reservations, parentForm.venue, parentForm.purpose, childNameTrimmed]);

            // 老師登記簿
            const attendanceList = useMemo(() => {
                if (role !== 'teacher') return [];
                let res = reservations;
                if (teacherSelectedClass !== '全部') res = res.filter(r => r.venue === teacherSelectedClass);
                if (teacherSelectedPurpose !== '全部') res = res.filter(r => r.purpose === teacherSelectedPurpose);
                
                const grouped = {};
                res.forEach(r => {
                    const name = (r.childName || r.name || '未命名').trim();
                    if (!grouped[name]) grouped[name] = { name: name, slots: [], venues: new Set(), purposes: new Set() };
                    grouped[name].slots.push(r);
                    grouped[name].venues.add(r.venue);
                    grouped[name].purposes.add(r.purpose);
                });
                
                return Object.values(grouped).map(g => ({
                    ...g,
                    venues: Array.from(g.venues),
                    purposes: Array.from(g.purposes),
                    slots: g.slots.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime))
                })).sort((a, b) => a.name.localeCompare(b.name));
            }, [reservations, teacherSelectedClass, teacherSelectedPurpose, role]);

            // 家長預約單 (嚴格隔離共用電腦時的資料顯示)
            const parentSlipData = useMemo(() => {
                if (role !== 'parent') return [];
                
                const myRes = reservations.filter(r => {
                    const rName = (r.childName || r.name || '').trim();
                    if (childNameTrimmed) return rName === childNameTrimmed;
                    return mySavedPins[r.id] === r.pin;
                });
                
                const grouped = {};
                myRes.forEach(r => {
                    const name = (r.childName || r.name || '未命名').trim();
                    if (!grouped[name]) grouped[name] = { name: name, slots: [], venues: new Set() };
                    grouped[name].slots.push(r);
                    grouped[name].venues.add(r.venue);
                });
                
                return Object.values(grouped).map(g => ({
                    ...g,
                    venues: Array.from(g.venues),
                    slots: g.slots.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime))
                })).sort((a, b) => a.name.localeCompare(b.name));
            }, [reservations, mySavedPins, role, childNameTrimmed]);

            // 家長結果通知單 (同步隔離結果通知的顯示)
            const parentNotificationData = useMemo(() => {
                if (role !== 'parent') return [];
                const results = [];
                
                Object.keys(classSettings).forEach(venue => {
                    const purposes = classSettings[venue]?.purposes || {};
                    Object.keys(purposes).forEach(purpose => {
                        const pData = purposes[purpose];
                        if (pData.isPublished && pData.publishedData) {
                            pData.publishedData.forEach(r => {
                                const rName = (r.childName || r.name || '').trim();
                                let isMatch = (mySavedPins[r.id] === r.pin) || (childNameTrimmed && rName === childNameTrimmed);

                                if (isMatch) {
                                    if (!results.some(existing => existing.id === r.id)) {
                                        results.push({ ...r, venue, purpose });
                                    }
                                }
                            });
                        }
                    });
                });
                return results.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
            }, [classSettings, childNameTrimmed, mySavedPins, role]);

            // 監聽結果數量，觸發跳動的未讀提醒
            useEffect(() => {
                if (role === 'parent' && parentNotificationData.length > prevNotifCount) {
                    setHasUnreadNotification(true);
                }
                setPrevNotifCount(parentNotificationData.length);
            }, [parentNotificationData.length, role, prevNotifCount]);

            const orphanedReservations = useMemo(() => {
                if (role !== 'teacher') return [];
                return reservations.filter(res => {
                    if (teacherSelectedClass !== '全部' && res.venue !== teacherSelectedClass) return false;
                    if (teacherSelectedPurpose !== '全部' && res.purpose !== teacherSelectedPurpose) return false;
                    
                    const cSettings = ((classSettings[res.venue] || {}).purposes || {})[res.purpose] || { slots: [] };
                    const slotExists = (cSettings.slots || []).some(s => s.date === res.date && s.startTime === res.startTime);
                    
                    return !slotExists;
                }).sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
            }, [reservations, classSettings, teacherSelectedClass, teacherSelectedPurpose, role]);

            const currentParentSettings = ((classSettings[parentForm.venue] || {}).purposes || {})[parentForm.purpose] || { slots: [], maxPerParent: 999, duration: 60 };
            
            const availableDates = useMemo(() => {
                const slots = currentParentSettings.slots || [];
                return [...new Set(slots.map(s => s.date))].sort();
            }, [currentParentSettings.slots]);

            useEffect(() => { setParentForm(prev => ({ ...prev, slotId: '' })); }, [parentForm.date, parentForm.venue, parentForm.purpose]);
            
            useEffect(() => {
                if (availableDates.length > 0) {
                    if (!parentForm.date || !availableDates.includes(parentForm.date)) {
                        setParentForm(prev => ({ ...prev, date: availableDates[0], slotId: '' }));
                    }
                } else {
                    setParentForm(prev => ({ ...prev, date: '', slotId: '' }));
                }
            }, [availableDates, parentForm.date]);

            const availableSlotsForDate = useMemo(() => {
                if (!parentForm.date) return [];
                return (currentParentSettings.slots || [])
                    .filter(s => s.date === parentForm.date)
                    .sort((a,b)=>a.startTime.localeCompare(b.startTime));
            }, [currentParentSettings, parentForm.date]);

            useEffect(() => {
                if (availableSlotsForDate.length > 0 && (!parentForm.slotId || !availableSlotsForDate.find(s => s.id === parentForm.slotId))) {
                    setParentForm(prev => ({ ...prev, slotId: availableSlotsForDate[0].id }));
                }
            }, [availableSlotsForDate, parentForm.slotId]);

            // 自動跳轉月曆年月
            useEffect(() => {
                if (role === 'teacher' && teacherSelectedClass !== '全部' && teacherSelectedPurpose !== '全部' && teacherSelectedPurpose) {
                    const pSets = ((classSettings[teacherSelectedClass] || {}).purposes || {})[teacherSelectedPurpose] || {};
                    const slots = pSets.slots || [];
                    if (slots.length > 0) {
                        const firstDateStr = [...slots].sort((a,b) => a.date.localeCompare(b.date))[0].date;
                        const [year, month] = firstDateStr.split('-');
                        setCurrentDate(new Date(Number(year), Number(month) - 1, 1));
                    } else {
                        setCurrentDate(new Date()); 
                    }
                }
            }, [role, teacherSelectedClass, teacherSelectedPurpose]); 

            useEffect(() => {
                if (role === 'parent' && isParentLocked && availableDates.length > 0) {
                    const firstDateStr = availableDates[0];
                    const [year, month] = firstDateStr.split('-');
                    setCurrentDate(new Date(Number(year), Number(month) - 1, 1));
                }
            }, [role, isParentLocked, parentForm.venue, parentForm.purpose, availableDates.length]);

            const showAlert = (message) => setDialog({ isOpen: true, message, type: 'alert', onConfirm: null });
            const showConfirm = (message, onConfirm) => setDialog({ isOpen: true, message, type: 'confirm', onConfirm });
            const showPinPrompt = (message, expectedPin, onConfirm, resId) => {
                let autoPin = '';
                try {
                    const savedPins = JSON.parse(localStorage.getItem('my_reservation_pins_v3') || '{}');
                    if (savedPins[resId]) autoPin = savedPins[resId];
                } catch (e) {}
                setPinInput(autoPin);
                setDialog({ isOpen: true, message, type: 'pin', expectedPin, onConfirm });
            };

            const saveLocal = (resData, setData) => {
                if (resData) {
                    setReservations(resData);
                    localStorage.setItem(LOCAL_RES_KEY, JSON.stringify(resData));
                }
                if (setData) {
                    setClassSettings(setData);
                    localStorage.setItem(LOCAL_SET_KEY, JSON.stringify(setData));
                }
            };

            const handleFirebaseError = (error, actionName) => {
                console.warn(`Firebase ${actionName}錯誤:`, error);
                setUseLocalMode(true); 
                try {
                    const savedRes = localStorage.getItem(LOCAL_RES_KEY);
                    const savedSet = localStorage.getItem(LOCAL_SET_KEY);
                    if (savedRes) setReservations(JSON.parse(savedRes));
                    if (savedSet) setClassSettings(JSON.parse(savedSet));
                } catch (e) {}

                if (error.code === 'permission-denied') {
                    showAlert(`⚠️ 雲端資料庫權限不足！\n系統已自動切換為「單機離線模式」。`);
                } else {
                    showAlert(`⚠️ 雲端連線失敗 (${actionName})。\n系統已自動切換為「單機離線模式」。`);
                }
            };

            useEffect(() => {
                try {
                    const savedRes = localStorage.getItem(LOCAL_RES_KEY);
                    const savedSet = localStorage.getItem(LOCAL_SET_KEY);
                    if (savedRes) setReservations(JSON.parse(savedRes));
                    if (savedSet) setClassSettings(JSON.parse(savedSet));
                } catch (e) {}

                const authenticate = async () => {
                    try { await auth.signInAnonymously(); } 
                    catch (error) { handleFirebaseError(error, "登入驗證"); }
                };
                authenticate();
            }, []);

            useEffect(() => {
                if (useLocalMode) return;

                const unsubRes = dbReservations.onSnapshot((snapshot) => {
                    setReservations(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }, (error) => handleFirebaseError(error, "讀取預約資料"));

                const unsubSet = dbSettings.onSnapshot((doc) => {
                    if (doc.exists) {
                        setClassSettings({ ...DEFAULT_CLASS_SETTINGS, ...doc.data().classes });
                    } else {
                        dbSettings.set({ classes: DEFAULT_CLASS_SETTINGS }).catch(e => console.warn(e));
                    }
                }, (error) => handleFirebaseError(error, "讀取班級設定"));
                
                return () => { unsubRes(); unsubSet(); };
            }, [useLocalMode]);

            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try { document.execCommand('copy'); } catch (err) {}
                document.body.removeChild(textArea);
            };

            // ==========================================
            // 老師專屬方法
            // ==========================================
            const handleTeacherPurposeChange = (e) => {
                const val = e.target.value;
                if (val === '__ADD_NEW__') {
                    setPromptInput('');
                    setDialog({
                        isOpen: true,
                        type: 'prompt',
                        message: '請輸入新的預約目的名稱 (例如: 萬聖節闖關)：',
                        onConfirm: (newPurpose) => {
                            setClassSettings(prevSettings => {
                                const classSets = prevSettings[teacherSelectedClass] || { purposes: {} };
                                if (!classSets.purposes[newPurpose]) {
                                    const newSettings = {
                                        ...prevSettings,
                                        [teacherSelectedClass]: {
                                            ...classSets,
                                            purposes: {
                                                ...classSets.purposes,
                                                [newPurpose]: { ...DEFAULT_PURPOSE_SETTINGS }
                                            }
                                        }
                                    };
                                    if (useLocalMode) saveLocal(null, newSettings);
                                    else dbSettings.set({ classes: newSettings }, { merge: true }).catch(err => console.warn(err));
                                    return newSettings;
                                }
                                return prevSettings;
                            });
                            setTeacherSelectedPurpose(newPurpose);
                        }
                    });

            const handleTeacherStartChange = (e) => {

            const handleAddSlots = () => {
                if (teacherSelectedClass === '全部' || teacherSelectedPurpose === '全部') return showAlert("請先選擇特定的班級與目的喔！");
                
                const startStr = `${teacherSlotForm.startHour}:${teacherSlotForm.startMin}`;
                const endStr = `${teacherSlotForm.endHour}:${teacherSlotForm.endMin}`;
                
                if (startStr >= endStr) return showAlert("結束時間必須晚於開始時間喔！");
                
                const currentSettings = ((classSettings[teacherSelectedClass] || {}).purposes || {})[teacherSelectedPurpose] || {};
                
                const todayStr = formatDate(new Date());
                if (currentSettings.deadline && todayStr > currentSettings.deadline) {
                    return showAlert("⚠️ 無法操作！\n\n此活動的預約截止日期已過，系統已鎖定，無法再新增或修改時段喔！");
                }
                
                if (isEditingSlot) {
                    const newSlots = (currentSettings.slots || []).map(s => 
                        s.id === teacherSlotForm.id ? { ...s, date: teacherSlotForm.date, startTime: startStr, endTime: endStr } : s
                    );
                    updatePurposeSetting('slots', newSlots);
                    setIsEditingSlot(false);
                    setTeacherSlotForm(prev => ({...prev, id: null}));
                    showAlert(`✅ 時段已成功更新！`);
                } else {
                    const duration = currentSettings.duration || 60;
                    let currentStr = startStr;
                    const generatedSlots = [];

                    while (currentStr < endStr) {
                        let nextStr = addMinutes(currentStr, duration);
                        if (nextStr > endStr) nextStr = endStr; 
                        
                        generatedSlots.push({
                            id: `slot_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
                            date: teacherSlotForm.date,
                            startTime: currentStr,
                            endTime: nextStr
                        });
                        currentStr = nextStr;
                    }

                    const existingSlots = currentSettings.slots || [];
                    const combinedSlots = [...existingSlots, ...generatedSlots].reduce((acc, curr) => {
                        const isDup = acc.find(s => s.date === curr.date && s.startTime === curr.startTime && s.endTime === curr.endTime);
                        if (!isDup) acc.push(curr);
                        return acc;
                    }, []);

                    updatePurposeSetting('slots', combinedSlots);

                    const nextStartStr = `${teacherSlotForm.endHour}:${teacherSlotForm.endMin}`;
                    const nextEndStr = addMinutes(nextStartStr, duration);
                    const [nH, nM] = nextEndStr.split(':');
                    
                    setTeacherSlotForm(prev => ({
                        ...prev,
                        startHour: prev.endHour,
                        startMin: prev.endMin,
                        endHour: nH,
                        endMin: nM
                    }));

                    showAlert(`✅ 成功產生 ${generatedSlots.length} 個預約時段！\n\n💡 系統已保留日期並自動帶入接續時段，方便您連續新增！`);

            const handleBoardDeleteRes = (resId) => {
                const currentSettings = ((classSettings[teacherSelectedClass] || {}).purposes || {})[teacherSelectedPurpose] || {};

            // 智慧自動排班
            const handleAutoResolveBoard = () => {
                if (teacherSelectedClass === '全部' || teacherSelectedPurpose === '全部') return showAlert("請先選擇單一班級與目的來進行自動排班喔！");
                
                const originalRequests = reservations.filter(r => r.venue === teacherSelectedClass && r.purpose === teacherSelectedPurpose);
                if (originalRequests.length === 0) return showAlert('目前沒有任何家長預約資料，無法進行排班喔！');

                const childrenMap = {};
                originalRequests.forEach(r => {
                    const name = (r.childName || r.name || '未命名').trim();
                    if (!childrenMap[name]) childrenMap[name] = [];
                    childrenMap[name].push(r);
                });

                const sortedChildren = Object.keys(childrenMap).sort((a, b) => childrenMap[a].length - childrenMap[b].length);

                let totalPerfectSolutionsCount = 0;
                const perfectSolutions = [];
                const MAX_SOLUTIONS_TO_KEEP = 15; 
                const HARD_LIMIT = 1000; 

                const backtrack = (childIdx, currentAssigned, usedSlots) => {
                    if (totalPerfectSolutionsCount >= HARD_LIMIT) return;
                    if (childIdx === sortedChildren.length) {
                        totalPerfectSolutionsCount++;
                        if (perfectSolutions.length < MAX_SOLUTIONS_TO_KEEP) {
                            perfectSolutions.push(Object.values(currentAssigned));
                        }
                        return;
                    }

                    const childName = sortedChildren[childIdx];
                    const reqs = childrenMap[childName];

                    for (let req of reqs) {
                        const slotKey = req.date + '_' + req.startTime;
                        if (!usedSlots.has(slotKey)) {
                            usedSlots.add(slotKey);
                            currentAssigned[childName] = req;
                            backtrack(childIdx + 1, currentAssigned, usedSlots);
                            usedSlots.delete(slotKey);
                            delete currentAssigned[childName];
                        }
                    }
                };

                backtrack(0, {}, new Set());

                if (totalPerfectSolutionsCount > 1) {
                    setDialog({
                        isOpen: true,
                        type: 'choose-assignment',
                        message: '',
                        solutions: perfectSolutions,
                        totalCount: totalPerfectSolutionsCount
                    });
                } else if (totalPerfectSolutionsCount === 1) {
                    updatePurposeSetting('boardData', perfectSolutions[0]);
                    showAlert('✨ 智慧自動排班完成！\n\n系統為您找到了 1 種「完美無衝突」的排班結果，已自動套用至排班板！');
                } else {
                    const slotAssignments = {}; 
                    const finalBoardData = [];

                    const tryAssign = (childName, visited) => {
                        const requests = childrenMap[childName];
                        for (let req of requests) {
                            const slotKey = req.date + '_' + req.startTime;
                            if (!visited.has(slotKey)) {
                                visited.add(slotKey);
                                if (!slotAssignments[slotKey] || tryAssign(slotAssignments[slotKey], visited)) {
                                    slotAssignments[slotKey] = childName;
                                    return true;
                                }
                            }
                        }
                        return false;
                    };

                    const unassignedChildren = [];
                    sortedChildren.forEach(childName => {
                        const visited = new Set();
                        if (!tryAssign(childName, visited)) {
                            unassignedChildren.push(childName);
                        }
                    });

                    for (let slotKey in slotAssignments) {
                        const cName = slotAssignments[slotKey];
                        const reqs = childrenMap[cName];
                        const matchedReq = reqs.find(r => (r.date + '_' + r.startTime) === slotKey);
                        if (matchedReq) finalBoardData.push(matchedReq);
                    }

                    unassignedChildren.forEach(cName => {
                        finalBoardData.push(childrenMap[cName][0]);
                    });

                    updatePurposeSetting('boardData', finalBoardData);
                    showAlert('⚠️ 自動排班完成 (含衝突)！\n\n目前家長志願無法達成「零衝突」完美分配。系統已盡最大努力排開，無法排開的已用「紅框」標示，請老師手動微調唷！');
                }
            };

            const handlePublishBoard = () => {
                if (teacherSelectedClass === '全部' || teacherSelectedPurpose === '全部') return showAlert("請先選擇單一班級與目的！");
                showConfirm("確定要把目前的排班結果發布給家長嗎？\n發布後，家長將可以在「預約結果通知」中看到這些安排！", () => {

            const exportBoardToExcel = () => {

                    csvContent += `${res.date},${res.startTime}~${res.endTime},${safeVenue},${safePurpose},${safeName}\n`;

                showAlert('📊 匯出成功！\n已下載最終排班表 Excel 檔案。');

            // 匯出排班板成圖檔
            const exportBoardToImage = () => {
                if (teacherSelectedClass === '全部' || teacherSelectedPurpose === '全部') return showAlert("請先選擇單一班級與目的！");
                const currentSettings = ((classSettings[teacherSelectedClass] || {}).purposes || {})[teacherSelectedPurpose] || {};
                const bData = currentSettings.boardData || [];

            const exportGAS = () => {
                if (teacherSelectedClass === '全部' || teacherSelectedPurpose === '全部') return showAlert("請先選擇單一班級與目的來產生表單腳本喔！");
                const currentSettings = ((classSettings[teacherSelectedClass] || {}).purposes || {})[teacherSelectedPurpose] || {};
                const slots = currentSettings.slots || [];
                if (slots.length === 0) return showAlert("目前沒有設定任何時段，無法產生腳本喔！");

                const slotStrings = slots.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime))
                                         .map(s => `'${s.date} ${s.startTime}~${s.endTime}'`)
                                         .join(',\n    ');
                const maxPer = currentSettings.maxPerParent || 999;
                
                const formTitle = `【${teacherSelectedClass}】 - ${teacherSelectedPurpose}`;
                const formDesc = `預約截止日期：${currentSettings.deadline || '無'}\n\n${currentSettings.notes || ''}`;

                let gasCode = `function createReservationForm() {
  var form = FormApp.create(${JSON.stringify(formTitle)});
  form.setDescription(${JSON.stringify(formDesc)});

  form.addTextItem().setTitle('小孩姓名').setRequired(true);

  `;
                
                if (maxPer === 1) {
                    gasCode += `var slotItem = form.addMultipleChoiceItem();

  slotItem.setChoiceValues([
    ${slotStrings}
  ]);`;
                } else {

  slotItem.setTitle('選擇預約時段').setRequired(true);
  slotItem.setChoiceValues([
    ${slotStrings}
  ]);`;
                    if (maxPer !== 999) {
                        gasCode += `
  var itemValidation = FormApp.createCheckboxValidation()
    .setHelpText('最多只能選擇 ${maxPer} 個時段')
    .requireSelectAtMost(${maxPer})
    .build();
  slotItem.setValidation(itemValidation);`;
                    }
                }

                gasCode += `\n\n  Logger.log('表單建立完成！網址：' + form.getEditUrl());\n}`;

                setDialog({
                    isOpen: true,
                    type: 'gas',
                    message: '請將以下代碼貼上至 Google Apps Script (https://script.google.com/) 執行：',
                    gasCode: gasCode
                });
            };

            // ==========================================
            // 家長專屬方法
            // ==========================================
            const handleParentSubmit = (e) => {
                if (e) e.preventDefault(); 
                
                const todayStr = formatDate(new Date());
                if (currentParentSettings.deadline && todayStr > currentParentSettings.deadline) {
                     return showAlert("⚠️ 預約失敗！\n\n此活動已經超過預約截止日期囉！無法再進行預約。");
                }

                if (!parentForm.slotId) return showAlert("請選擇一個預約時段！");

                const selectedSlot = availableSlotsForDate.find(s => s.id === parentForm.slotId);
                if (!selectedSlot) return showAlert("請選擇一個有效的預約時段！");

                const alreadyBooked = reservations.some(r => 
                    r.venue === parentForm.venue && 
                    r.purpose === parentForm.purpose &&
                    (r.childName || r.name || '').trim() === childNameTrimmed && 
                    r.date === selectedSlot.date && 
                    r.startTime === selectedSlot.startTime
                );

                if (alreadyBooked) {
                    setParentForm(prev => ({ ...prev, slotId: '' }));
                    return showAlert("⚠️ 預約失敗！\n\n您已經為這位小孩預約過這個時段囉！請勿重複預約。");
                }

                if (currentParentSettings.maxPerParent && currentParentSettings.maxPerParent !== 999 && parentBookingsCount >= currentParentSettings.maxPerParent) {
                    setParentForm(prev => ({ ...prev, slotId: '' }));
                    return showAlert(`⚠️ 預約失敗！\n\n【${childNameTrimmed}】在此活動已達到最高預約上限（共 ${currentParentSettings.maxPerParent} 個時段）。`);
                }

                setIsSubmitting(true);
                const currentPin = Math.floor(1000 + Math.random() * 9000).toString();
                const newReservationData = {
                    id: Date.now().toString(),
                    childName: childNameTrimmed,
                    venue: parentForm.venue,
                    purpose: parentForm.purpose,
                    date: selectedSlot.date,
                    startTime: selectedSlot.startTime,
                    endTime: selectedSlot.endTime,
                    color: getColorForName(childNameTrimmed),
                    pin: currentPin
                };

                const handleSuccess = () => {
                    setIsSubmitting(false);
                    setDialog({ isOpen: true, type: 'show-pin', message: '🎉 預約成功！您的專屬確認碼為：', pinToCopy: currentPin, warning: '請務必記下確認碼，若需取消請點擊左側「預約單」或月曆上您的預約。', onConfirm: null });
                };

                if (useLocalMode) {
                    saveLocal([...reservations, newReservationData], null);
                    try {
                        const savedPins = JSON.parse(localStorage.getItem('my_reservation_pins_v3') || '{}');
                        savedPins[newReservationData.id] = currentPin;
                        localStorage.setItem('my_reservation_pins_v3', JSON.stringify(savedPins));
                    } catch(e) {}
                    handleSuccess();
                } else {
                    dbReservations.doc(newReservationData.id).set(newReservationData).then(() => {
                        try {
                            const savedPins = JSON.parse(localStorage.getItem('my_reservation_pins_v3') || '{}');
                            savedPins[newReservationData.id] = currentPin;
                            localStorage.setItem('my_reservation_pins_v3', JSON.stringify(savedPins));
                        } catch(e) {}
                        handleSuccess();
                    }).catch(err => {
                        setIsSubmitting(false);
                        handleFirebaseError(err, "預約新增");
                    });
                }
            };

            // ==========================================
            // 共用月曆模組
            // ==========================================
            const renderCalendarView = (viewRole, viewClass, viewPurpose) => {
                const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
                const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));

                const handleDeleteOrphan = (res) => {
                    const pSet = ((classSettings[res.venue] || {}).purposes || {})[res.purpose] || {};
                    const todayStr = formatDate(new Date());
                    if (pSet.deadline && todayStr > pSet.deadline) {
                        return showAlert("⚠️ 無法刪除！\n\n此活動的預約截止日期已過，系統已鎖定，無法再刪除紀錄喔！");
                    }

                    showConfirm(`確定要刪除 【${res.childName || res.name || '未命名'}】 的無效預約紀錄嗎？\n(此預約原本的時段已被刪除)`, () => {
                        if (useLocalMode) {
                            saveLocal(reservations.filter(r => r.id !== res.id), null);
                            showAlert("🗑️ 已成功刪除無效紀錄！");
                        } else {
                            dbReservations.doc(res.id).delete()
                                .then(() => showAlert("🗑️ 已成功刪除無效紀錄！"))
                                .catch(e => handleFirebaseError(e, "刪除無效預約"));
                        }
                    });
                };

                const handleCancelRes = (res) => {
                    const resId = res.id;
                    const pin = res.pin;
                    
                    // 檢查是否超過截止日
                    const pSet = ((classSettings[res.venue] || {}).purposes || {})[res.purpose] || {};
                    const todayStr = formatDate(new Date());
                    if (pSet.deadline && todayStr > pSet.deadline) {
                        return showAlert("⚠️ 無法刪除！\n\n此活動的預約截止日期已過，系統已鎖定，無法再刪除或取消預約喔！");
                    }

                    const promptMsg = viewRole === 'teacher' 
                        ? "請輸入確認碼以取消此預約：\n(💡 老師可直接輸入管理員密碼 8888 強制刪除)" 
                        : "請輸入確認碼以取消您的預約：";
                        
                    showPinPrompt(promptMsg, pin, () => {
                        if (useLocalMode) {
                            saveLocal(reservations.filter(r => r.id !== resId), null);
                            showAlert("🗑️ 已成功取消預約！");
                        } else {
                            dbReservations.doc(resId).delete().then(() => showAlert("🗑️ 已成功取消預約！")).catch(e => handleFirebaseError(e, "取消預約"));
                        }
                    }, resId);
                };

                const handleTeacherDeleteSlot = (cName, pName, slotId) => {
                    const pSet = ((classSettings[cName] || {}).purposes || {})[pName] || {};
                    const todayStr = formatDate(new Date());
                    if (pSet.deadline && todayStr > pSet.deadline) {
                        return showAlert("⚠️ 無法刪除！\n\n此活動的預約截止日期已過，系統已鎖定，無法再刪除開放時段喔！");
                    }

                    showConfirm(`確定要刪除這個開放時段嗎？\n(注意：如果有家長已預約，預約紀錄仍會保留在資料庫中，但月曆上將不會再顯示此時段。)` , () => {
                        const classSets = classSettings[cName] || { purposes: {} };
                        const pSettings = classSets.purposes[pName] || { slots: [] };
                        const newSlots = (pSettings.slots || []).filter(s => s.id !== slotId);
                        
                        const newSettings = { 
                            ...classSettings, 
                            [cName]: { 
                                ...classSets, 
                                purposes: { ...classSets.purposes, [pName]: { ...pSettings, slots: newSlots } }
                            } 
                        };
                        setClassSettings(newSettings);
                        if (useLocalMode) saveLocal(null, newSettings);
                        else dbSettings.set({ classes: newSettings }, { merge: true });
                    });
                };

                const exportToExcel = () => {
                    if (reservations.length === 0) return showAlert('目前還沒有任何預約資料可以匯出喔！');
                    const sortedReservations = [...reservations].sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
                    let csvContent = '\uFEFF預約日期,時段,班級,預約目的,小孩姓名\n';
                    sortedReservations.forEach(res => {
                        const rName = res.childName || res.name || '未命名';
                        const safeName = `"${rName.replace(/"/g, '""')}"`;
                        const safeVenue = `"${res.venue.replace(/"/g, '""')}"`;
                        const safePurpose = `"${res.purpose.replace(/"/g, '""')}"`;
                        csvContent += `${res.date},${res.startTime}~${res.endTime},${safeVenue},${safePurpose},${safeName}\n`;
                    });
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = window.URL.createObjectURL(blob);
                    link.download = '幼兒園預約資料.csv';
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                    showAlert('📊 匯出成功！\n已下載 Excel 檔案。');
                };

                return (
                    <div className="mt-8">
                        <div className="flex flex-col md:flex-row items-center justify-between mb-4 px-2 gap-4">
                            {viewRole === 'teacher' && (
                                <button onClick={exportToExcel} className="sketchy-btn sketchy-border-sm px-4 py-2 bg-green-50 text-green-800 font-bold flex items-center gap-2">
                                    <span>📊</span> 匯出所有預約資料 (Excel)
                                </button>
                            )}
                            
                            {/* 年月選擇器 */}
                            <div className="flex items-center justify-between w-full md:w-auto gap-2 ml-auto">
                                <button onClick={prevMonth} className="sketchy-btn sketchy-border-sm px-3 py-1 text-xl font-bold bg-white">&lt;</button>
                                <div className="flex gap-1 text-xl md:text-2xl font-bold text-slate-800">
                                    <select value={currentDate.getFullYear()} onChange={e => setCurrentDate(new Date(Number(e.target.value), currentDate.getMonth(), 1))} className="sketchy-border-sm px-2 py-1 bg-white outline-none">
                                        {[...Array(10)].map((_, i) => {
                                            const y = new Date().getFullYear() - 2 + i;
                                            return <option key={y} value={y}>{y} 年</option>
                                        })}
                                    </select>
                                    <select value={currentDate.getMonth()} onChange={e => setCurrentDate(new Date(currentDate.getFullYear(), Number(e.target.value), 1))} className="sketchy-border-sm px-2 py-1 bg-white outline-none">
                                        {[...Array(12)].map((_, i) => <option key={i} value={i}>{i + 1} 月</option>)}
                                    </select>
                                </div>
                                <button onClick={nextMonth} className="sketchy-btn sketchy-border-sm px-3 py-1 text-xl font-bold bg-white">&gt;</button>
                            </div>
                        </div>
                        
                        <div className="text-center mb-4">
                            <span className="bg-slate-800 text-white px-4 py-1 sketchy-border-sm text-lg font-bold shadow-sm">
                                📍 顯示條件：{viewClass === '全部' ? '🌈 全部班級' : `【${viewClass}】`} - {viewPurpose === '全部' ? '所有預約目的' : viewPurpose}
                            </span>
                        </div>

                        <div className="calendar-grid bg-white shadow-lg">
                            <div className="grid grid-cols-7 bg-slate-800 text-white border-b-4 border-slate-800">
                                {['日', '一', '二', '三', '四', '五', '六'].map(day => <div key={day} className="py-2 text-center font-bold text-lg md:text-xl border-r border-slate-700 last:border-r-0">星期{day}</div>)}
                            </div>
                            <div className="grid grid-cols-7 bg-white">
                                {calendarDays.map((dayObj, index) => {
                                    const dateStr = formatDate(dayObj.date);
                                    const isToday = dateStr === formatDate(new Date());
                                    
                                    let dailySlots = [];
                                    
                                    const collectSlots = (cName, pName) => {
                                        const pSettings = ((classSettings[cName] || {}).purposes || {})[pName] || {};
                                        const cSlots = (pSettings.slots || []).filter(s => s.date === dateStr);
                                        cSlots.forEach(s => dailySlots.push({...s, className: cName, purposeName: pName, maxCap: pSettings.maxCapacity || 3}));
                                    };

                                    if (viewClass === '全部') {
                                        CLASS_OPTIONS.forEach(cName => {
                                            const pKeys = Object.keys((classSettings[cName] || {}).purposes || {});
                                            pKeys.forEach(pName => collectSlots(cName, pName));
                                        });
                                    } else {
                                        if (viewPurpose === '全部') {
                                            const pKeys = Object.keys((classSettings[viewClass] || {}).purposes || {});
                                            pKeys.forEach(pName => collectSlots(viewClass, pName));
                                        } else {
                                            collectSlots(viewClass, viewPurpose);
                                        }
                                    }
                                    
                                    dailySlots.sort((a,b) => a.startTime.localeCompare(b.startTime));

                                    return (
                                        <div key={index} className={`calendar-cell p-1 md:p-2 ${dayObj.isCurrentMonth ? '' : 'bg-gray-100 text-gray-400'} ${isToday ? 'bg-yellow-50' : ''}`}>
                                            <div className="flex justify-between items-start mb-1">
                                                <span className={`font-bold text-lg inline-block w-8 h-8 text-center leading-8 rounded-full ${isToday ? 'bg-red-400 text-white' : ''}`}>{dayObj.date.getDate()}</span>
                                            </div>
                                            
                                            <div className="space-y-2 mt-1 h-24 overflow-y-auto no-scrollbar">
                                                {dailySlots.map((slot, sIdx) => {
                                                    const slotReservations = reservations.filter(r => r.venue === slot.className && r.purpose === slot.purposeName && r.date === slot.date && r.startTime === slot.startTime);
                                                    
                                                    const myRes = slotReservations.find(r => 
                                                        viewRole === 'parent' && 
                                                        isParentLocked && 
                                                        (r.childName || r.name || '').trim() === childNameTrimmed && 
                                                        r.venue === parentForm.venue &&
                                                        r.purpose === parentForm.purpose
                                                    );

                                                    return (
                                                        <div key={sIdx} className="text-xs p-1 rounded sketchy-border-sm border border-slate-300 relative group bg-green-50">
                                                            {/* 老師視角 */}
                                                            {viewRole === 'teacher' && (
                                                                <>
                                                                    <div 
                                                                        className="font-bold text-slate-800 flex flex-col cursor-pointer hover:text-blue-600 transition-colors"
                                                                        onClick={() => handleEditSlot(slot.className, slot.purposeName, slot)}
                                                                        title="點擊修改此時段時間"
                                                                    >
                                                                        <div className="flex justify-between">
                                                                            <span>{slot.className}</span>
                                                                            <span className="text-[10px] bg-white px-1 rounded sketchy-border-sm">{slot.startTime}</span>
                                                                        </div>
                                                                        {(viewClass === '全部' || viewPurpose === '全部') && <span className="text-[10px] text-slate-500">{slot.purposeName}</span>}
                                                                    </div>
                                                                    
                                                                    {slotReservations.map(r => (
                                                                        <div key={r.id} className="truncate text-slate-800 bg-white/60 p-0.5 rounded mt-0.5 cursor-pointer hover:bg-red-100 transition-colors" title={`點擊刪除 ${r.childName || r.name || '未命名'} 的預約`} onClick={() => handleCancelRes(r)}>
                                                                            • {r.childName || r.name || '未命名'}
                                                                        </div>
                                                                    ))}
                                                                    <button onClick={() => handleTeacherDeleteSlot(slot.className, slot.purposeName, slot.id)} className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-4 h-4 flex items-center justify-center opacity-0 group-hover:opacity-100" title="刪除此時段">×</button>
                                                                </>
                                                            )}

                                                            {/* 家長視角 */}
                                                            {viewRole === 'parent' && (
                                                                <>
                                                                    <div className="font-bold text-slate-800 text-center">{slot.startTime}~{slot.endTime}</div>
                                                                    {myRes ? (
                                                                        <div onClick={() => handleCancelRes(myRes)} className="mt-1 bg-green-200 text-green-900 p-1 rounded text-center font-bold cursor-pointer hover:bg-red-200 transition-colors" title="點擊取消預約">
                                                                            ✓ 你的預約<br/>({myRes.childName || myRes.name || '未命名'})
                                                                        </div>
                                                                    ) : (
                                                                        <div className="text-center mt-1 text-slate-600 font-medium">
                                                                            開放預約中
                                                                        </div>
                                                                    )}
                                                                </>
                                                            )}
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* 老師視角：無對應時段的預約清單 (孤兒預約) */}
                        {viewRole === 'teacher' && orphanedReservations.length > 0 && (
                            <div className="mt-6 bg-red-50 p-4 md:p-6 sketchy-border-sm rounded-xl border border-red-200">
                                <h3 className="text-xl font-bold text-red-800 mb-3 flex items-center gap-2">
                                    <span>⚠️</span> 系統中存在未對應時段的預約 (該時段已被刪除)
                                </h3>
                                <div className="space-y-3 max-h-60 overflow-y-auto pr-2 no-scrollbar">
                                    {orphanedReservations.map(res => (
                                        <div key={res.id} className="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-3 rounded sketchy-border-sm gap-2 shadow-sm">
                                            <div>
                                                <div className="font-bold text-slate-800 text-lg">{res.childName || res.name || '未命名'}</div>
                                                <div className="text-sm text-slate-600 mt-1">
                                                    <span className="bg-gray-200 px-2 py-0.5 rounded mr-2 font-bold">{res.venue}</span>
                                                    <span className="text-orange-600 font-bold mr-2">[{res.purpose}]</span>
                                                    原預約時段：{res.date} {res.startTime}~{res.endTime}
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => handleDeleteOrphan(res)} 
                                                className="sketchy-btn sketchy-border-sm px-4 py-2 bg-red-500 text-white font-bold text-sm whitespace-nowrap"
                                            >
                                                刪除紀錄
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="space-y-8 pb-12">
                    {useLocalMode && (
                        <div className="bg-yellow-50 border-b-4 border-yellow-400 p-3 md:p-4 text-center sketchy-border-sm mx-4 mt-4 shadow-sm relative overflow-hidden">
                            <h3 className="text-xl font-bold text-yellow-800 mb-1">⚠️ 目前為「單機離線模式」</h3>
                            <p className="text-yellow-700 text-sm">因雲端權限設定未完成，資料暫存於瀏覽器中。請老師至 Firebase Console 修改設定喔！</p>
                        </div>
                    )}

                    {/* 老師專用：左側浮動登記簿 */}
                    {role === 'teacher' && (
                        <>
                            <div className={`fixed left-0 top-1/4 z-40 transition-transform duration-300 ${isAttendanceOpen ? '-translate-x-full' : 'translate-x-0'}`}>
                                <button onClick={() => setIsAttendanceOpen(true)} className="sketchy-btn bg-yellow-100 text-yellow-900 border-2 border-l-0 border-slate-800 font-bold py-3 px-2 rounded-r-xl shadow-md flex flex-col items-center gap-1">
                                    <span className="text-xl">📋</span>
                                    <span className="text-sm font-bold flex flex-col"><span>登</span><span>記</span><span>簿</span></span>
                                </button>
                            </div>

                            <div className={`fixed left-0 top-4 bottom-4 w-[85vw] sm:w-[350px] md:w-[420px] bg-white border-2 border-l-0 border-slate-800 rounded-r-2xl shadow-2xl z-40 flex flex-col transition-transform duration-300 ${isAttendanceOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                                <div className="p-3 border-b-2 border-dashed border-slate-300 flex justify-between items-center bg-yellow-100 rounded-tr-xl">
                                    <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">📋 預約點名簿</h3>
                                    <button onClick={() => setIsAttendanceOpen(false)} className="text-slate-500 hover:text-slate-800 text-2xl font-bold px-2 leading-none">&times;</button>
                                </div>
                                <div className="p-3 bg-slate-50 text-sm font-bold text-slate-700 text-center border-b border-slate-200 flex flex-col gap-2">
                                    <div>
                                        <span className="text-base text-blue-700">
                                            {teacherSelectedClass === '全部' ? '🌈 全部班級' : `【${teacherSelectedClass}】`} <br/>
                                            {teacherSelectedPurpose === '全部' ? '所有目的' : teacherSelectedPurpose}
                                        </span>
                                        <br/>
                                        已完成登記：<span className="text-2xl text-blue-600 mx-1">{attendanceList.length}</span>位小孩
                                    </div>
                                    
                                    {attendanceList.length > 0 && (
                                        <select 
                                            className="sketchy-border-sm w-full px-2 py-1 text-sm font-bold bg-white text-slate-700 outline-none cursor-pointer"
                                            onChange={(e) => {
                                                if (e.target.value) {
                                                    const el = document.getElementById(`attendance-child-${e.target.value}`);
                                                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                                                    e.target.value = ''; // 捲動後歸零選單
                                                }
                                            }}
                                        >
                                            <option value="">🔍 快速尋找跳轉到小孩...</option>
                                            {attendanceList.map(child => {
                                                // 動態計算此小孩是否有「未選滿」的狀況，以顯示在選單中
                                                let isIncomplete = false;
                                                child.purposes.forEach(p => {
                                                    child.venues.forEach(v => {
                                                        const pSet = ((classSettings[v] || {}).purposes || {})[p] || {};
                                                        const maxReq = pSet.maxPerParent || 999;
                                                        const currentCount = child.slots.filter(s => s.venue === v && s.purpose === p).length;
                                                        if (maxReq !== 999 && currentCount > 0 && currentCount < maxReq) {
                                                            isIncomplete = true;
                                                        }
                                                    });
                                                });
                                                return (
                                                    <option key={child.name} value={child.name}>
                                                        {child.name} {isIncomplete ? '(⚠️ 未滿)' : ''}
                                                    </option>
                                                );
                                            })}
                                        </select>
                                    )}
                                </div>
                                <div className="flex-1 overflow-y-auto p-3 space-y-3 no-scrollbar bg-slate-50/50">
                                    {attendanceList.length === 0 ? (
                                        <div className="text-center text-slate-400 py-6 font-bold text-sm">目前尚無預約資料</div>
                                    ) : (
                                        attendanceList.map((child, idx) => {
                                            // 動態計算此小孩是否有「未選滿」的狀況
                                            let isIncomplete = false;
                                            child.purposes.forEach(p => {
                                                child.venues.forEach(v => {
                                                    const pSet = ((classSettings[v] || {}).purposes || {})[p] || {};
                                                    const maxReq = pSet.maxPerParent || 999;
                                                    const currentCount = child.slots.filter(s => s.venue === v && s.purpose === p).length;
                                                    if (maxReq !== 999 && currentCount > 0 && currentCount < maxReq) {
                                                        isIncomplete = true;
                                                    }
                                                });
                                            });

                                            return (
                                                <div key={child.name} id={`attendance-child-${child.name}`} className={`p-3 rounded-lg sketchy-border-sm text-sm shadow-sm relative transition-colors ${isIncomplete ? 'bg-red-50 border-red-300 border-2' : 'bg-white hover:bg-blue-50'}`}>
                                                    <div className={`font-bold text-base mb-1 flex items-center justify-between ${isIncomplete ? 'text-red-800' : 'text-slate-800'}`}>
                                                        <span>{idx + 1}. {child.name} {isIncomplete && <span className="text-red-500 text-xs ml-1 bg-red-100 px-1 rounded border border-red-200">⚠️ 未滿</span>}</span>
                                                        <span className={`${isIncomplete ? 'text-red-600' : 'text-blue-600'} text-xs`}>(共 {child.slots.length} 筆)</span>
                                                    </div>
                                                    <div className="space-y-1 mt-2 border-t border-slate-100 pt-2">
                                                        {child.slots.map(s => {
                                                            // 抓取該時段是否為已發布的確定狀態
                                                            const pSet = ((classSettings[s.venue] || {}).purposes || {})[s.purpose] || {};
                                                            const isPublished = pSet.isPublished;
                                                            const confirmedSlot = isPublished ? (pSet.publishedData || []).find(r => r.id === s.id) : null;
                                                            const isConfirmed = !!confirmedSlot;

                                                            return (
                                                                <div key={s.id} className={`text-xs font-medium p-2 rounded border ${isConfirmed ? 'bg-green-50 border-green-400 text-green-900 shadow-sm' : isIncomplete ? 'bg-white border-red-200 text-red-700' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>
                                                                    <div className={`font-bold mb-1 flex justify-between items-start gap-1 ${isConfirmed ? 'text-green-800' : isIncomplete ? 'text-red-800' : 'text-slate-700'}`}>
                                                                        <div className="flex gap-1 flex-wrap">
                                                                            {teacherSelectedClass === '全部' && <span className={`${isConfirmed ? 'bg-green-200 text-green-900' : isIncomplete ? 'bg-red-100' : 'bg-slate-200'} px-1 rounded`}>{s.venue}</span>}
                                                                            {teacherSelectedPurpose === '全部' && <span className={`${isConfirmed ? 'bg-green-200 text-green-900' : 'bg-orange-100 text-orange-800'} px-1 rounded`}>{s.purpose}</span>}
                                                                        </div>
                                                                        {isConfirmed && <span className="bg-green-600 text-white px-1.5 py-0.5 rounded text-[10px] whitespace-nowrap shadow-sm flex items-center gap-1">✅ 已確定預約</span>}
                                                                    </div>
                                                                    <div className={isConfirmed ? "font-bold text-sm" : ""}>
                                                                        📅 {isConfirmed ? confirmedSlot.date : s.date} 🕒 {isConfirmed ? `${confirmedSlot.startTime}~${confirmedSlot.endTime}` : `${s.startTime}~${s.endTime}`}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        </>
                    )}

                    {/* 家長專用：左側浮動工具列 */}
                    {role === 'parent' && (
                        <>
                            {/* 1. 我的預約單與結果通知按鈕 */}
                            <div className={`fixed left-0 top-1/4 z-40 transition-transform duration-300 ${isReservationSlipOpen || isNotificationOpen ? '-translate-x-full' : 'translate-x-0'}`}>
                                <button onClick={() => setIsReservationSlipOpen(true)} className="sketchy-btn bg-green-100 text-green-900 border-2 border-l-0 border-slate-800 font-bold py-3 px-2 rounded-r-xl shadow-md flex flex-col items-center gap-1 mb-2">
                                    <span className="text-xl">📋</span>
